function render(){navset();let v='';switch(S.page){case'welcome':v=welcome();break;case'guide':v=guide();break;case'setupSchedule':v=setupSchedule();break;case'importPreview':v=importPreview();break;case'photoImport':v=photoImport();break;case'profileSetup':v=profileSetup();break;case'avatarSetup':v=avatarSetup();break;case'today':v=today();break;case'plan':v=plan();break;case'timer':v=timer();break;case'break':v=breakPage();break;case'restdone':v=restDone();break;case'review':v=review();break;case'insight':v=insight();break;case'schedule':v=schedule();break;case'courseform':v=courseForm();break;case'friends':v=friends();break;case'friendform':v=friendForm();break;case'frienddetail':v=friendDetail();break;case'scan':v=scan();break;case'myqr':v=myqr();break;case'invites':v=invites();break;case'groups':v=groups();break;case'groupform':v=groupForm();break;case'groupdetail':v=groupDetail();break;case'ranking':v=ranking();break;case'profile':v=profile();break;case'profileedit':v=profileEdit();break;case'preferences':v=preferences();break;case'mycourseprefs':v=title('My Schedule')+`<div class="card"><div class="setting"><span>Weekly classes</span><b>${S.courses.length}  class</b></div><div class="setting"><span>Schedule settings</span><button class="textbtn" onclick="go('schedule')">View schedule →</button></div></div>`;break;case'notifications':v=notifications();break;case'reminders':v=reminders();break;case'apps':v=apps();break;default:v=today()}content.innerHTML=v;content.scrollTop=0;if(S.page==='timer')startTimer();if(S.page==='break')startBreak()}

function esc(x){return String(x||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function parseOCR(text){let found=[],day=1;for(const line of text.split(/\n/).map(x=>x.trim()).filter(Boolean)){let d=line.match(/\b(mon|tue|wed|thu|fri|星期[一二三四五])\b/i);if(d){let k=d[1].toLowerCase();day=/^(tue|星期二)/.test(k)?2:/^(wed|星期三)/.test(k)?3:/^(thu|星期四)/.test(k)?4:/^(fri|星期五)/.test(k)?5:1}let m=line.match(/(\d{1,2})[:：](\d{2})\s*[-–—~至到]\s*(\d{1,2})[:：](\d{2})/);if(m){let name=line.replace(m[0],'').replace(/星期[一二三四五]/,'').trim()||'Imported class';found.push({name,teacher:'',place:'',day,start:m[1].padStart(2,'0')+':'+m[2],end:m[3].padStart(2,'0')+':'+m[4],done:false})}}return found}
async function detectGridCourses(file,data){const lines=(data.lines||[]).filter(x=>x.text&&x.bbox),bitmap=await createImageBitmap(file),factor=Math.min(1,700/bitmap.width),canvas=document.createElement('canvas');canvas.width=Math.round(bitmap.width*factor);canvas.height=Math.round(bitmap.height*factor);const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);const pix=ctx.getImageData(0,0,canvas.width,canvas.height).data,w=canvas.width,h=canvas.height,n=w*h,mask=new Uint8Array(n),seen=new Uint8Array(n);for(let y=0;y<h;y++)for(let x=0;x<w;x++){let k=(y*w+x)*4,r=pix[k],g=pix[k+1],b=pix[k+2];if(Math.max(r,g,b)>165&&Math.max(r,g,b)-Math.min(r,g,b)>20&&r+g+b>500)mask[y*w+x]=1}let q=new Int32Array(n),boxes=[];for(let i=0;i<n;i++){if(!mask[i]||seen[i])continue;let head=0,tail=0,minx=w,miny=h,maxx=0,maxy=0;seen[i]=1;q[tail++]=i;while(head<tail){let at=q[head++],x=at%w,y=(at/w)|0;minx=Math.min(minx,x);maxx=Math.max(maxx,x);miny=Math.min(miny,y);maxy=Math.max(maxy,y);for(let yy=Math.max(0,y-1);yy<=Math.min(h-1,y+1);yy++)for(let xx=Math.max(0,x-1);xx<=Math.min(w-1,x+1);xx++){let j=yy*w+xx;if(mask[j]&&!seen[j]){seen[j]=1;q[tail++]=j}}}let bw=maxx-minx+1,bh=maxy-miny+1;if(tail>220&&bw>18&&bh>14&&bw/bh>.22&&bw/bh<2.4)boxes.push({x0:minx,y0:miny,x1:maxx,y1:maxy,cx:(minx+maxx)/2,cy:(miny+maxy)/2})}const ocr=lines.map(l=>({text:l.text.trim(),x0:l.bbox.x0*factor,y0:l.bbox.y0*factor,x1:l.bbox.x1*factor,y1:l.bbox.y1*factor,cx:(l.bbox.x0+l.bbox.x1)/2*factor,cy:(l.bbox.y0+l.bbox.y1)/2*factor}));const ticks=ocr.map(l=>{let m=l.text.match(/^([0-2]?\d)[:：.](\d{2})$/);return m?{y:l.cy,t:+m[1]*60+(+m[2]),x:l.cx}:null}).filter(Boolean).sort((a,b)=>a.y-b.y);if(boxes.length<2||ticks.length<2)return[];let firstY=ticks[0].y,lastY=ticks[ticks.length-1].y;let headers=ocr.filter(l=>l.cy<firstY-8&&/^(mo|mon(day)?|tu|tue(sday)?|we|wed(nesday)?|th|thu(rsday)?|fr|fri(day)?|星期[一二三四五])$/i.test(l.text)).sort((a,b)=>a.cx-b.cx);let dayXs=headers.length>=3?headers.map(x=>x.cx):[];if(dayXs.length<3){let xs=boxes.filter(b=>b.cy>firstY-8&&b.cy<lastY).map(b=>b.cx).sort((a,b)=>a-b);dayXs=[];for(const x of xs){if(!dayXs.length||x-dayXs.at(-1)>w*.09)dayXs.push(x);else dayXs[dayXs.length-1]=(dayXs.at(-1)+x)/2}if(dayXs.length>5)dayXs=dayXs.slice(0,5)}if(dayXs.length<3)return[];const interp=y=>{for(let i=1;i<ticks.length;i++)if(y<=ticks[i].y){let a=ticks[i-1],b=ticks[i];return a.t+(y-a.y)*(b.t-a.t)/(b.y-a.y)}let a=ticks[ticks.length-2],b=ticks.at(-1);return b.t+(y-b.y)*(b.t-a.t)/(b.y-a.y)};const snap=t=>Math.max(0,Math.round(t/30)*30),fmt=t=>String(Math.floor(t/60)%24).padStart(2,'0')+':'+String(t%60).padStart(2,'0');const cropWorker=await Tesseract.createWorker('eng');await cropWorker.setParameters({tessedit_pageseg_mode:'6',preserve_interword_spaces:'1'});let out=[];for(const b of boxes){if(b.cy<firstY-5||b.cy>lastY+30)continue;let d=0;for(let j=1;j<dayXs.length;j++)if(Math.abs(b.cx-dayXs[j])<Math.abs(b.cx-dayXs[d]))d=j;let sx=Math.max(0,Math.floor((b.x0-5)/factor)),sy=Math.max(0,Math.floor((b.y0-5)/factor)),sw=Math.min(bitmap.width-sx,Math.ceil((b.x1-b.x0+10)/factor)),sh=Math.min(bitmap.height-sy,Math.ceil((b.y1-b.y0+10)/factor));let crop=document.createElement('canvas');crop.width=Math.max(1,sw*3);crop.height=Math.max(1,sh*3);crop.getContext('2d').drawImage(bitmap,sx,sy,sw,sh,0,0,crop.width,crop.height);let txt='';try{const read=await cropWorker.recognize(crop);txt=(read.data.text||'').replace(/\s+/g,' ').trim()}catch(_){txt=ocr.filter(l=>l.cx>=b.x0-3&&l.cx<=b.x1+3&&l.cy>=b.y0-3&&l.cy<=b.y1+3).sort((a,c)=>a.cy-c.cy).map(x=>x.text).join(' ').replace(/\s+/g,' ').trim()}if(!txt)continue;let start=snap(interp(b.y0)),end=snap(interp(b.y1));if(end<=start)end=start+60;out.push({name:txt,teacher:'',place:'',day:d+1,start:fmt(start),end:fmt(end),done:false})}await cropWorker.terminate();bitmap.close();return out.filter(c=>Number(c.start.slice(0,2))>=6&&Number(c.end.slice(0,2))<=23)}
async function handleTimetableImage(e){let f=e.target.files&&e.target.files[0];if(!f)return;if(S.page==='setupSchedule')S.ocrOrigin='setupSchedule';else if(S.page!=='photoImport')S.ocrOrigin='schedule';S.ocrImage=URL.createObjectURL(f);S.ocrCourses=[];S.ocrStatus='Preparing on-device recognition…';go('photoImport');try{if(!window.Tesseract)throw Error('Recognition library did not load. Check your internet connection.');let r=await Tesseract.recognize(f,'eng+chi_tra',{logger:m=>{if(m.status==='recognizing text'){S.ocrStatus='Recognizing timetable… '+Math.round((m.progress||0)*100)+'%';let x=document.querySelector('.subtle');if(x)x.textContent=S.ocrStatus}}});S.ocrCourses=await detectGridCourses(f,r.data);if(!S.ocrCourses.length)S.ocrCourses=parseOCR(r.data.text||'');S.ocrStatus=S.ocrCourses.length?'Found '+S.ocrCourses.length+' possible classes. Names were read from each color block; verify the name, weekday and inferred time before importing.':'No course blocks matched readable weekday and time labels. Try a clear full timetable screenshot or add manually.';render()}catch(x){S.ocrStatus=x.message||'Could not read image.';render()}finally{e.target.value=''}}
function importOcrCourses(){let rows=S.ocrCourses.filter(c=>c.name.trim()&&c.start&&c.end&&c.end>c.start);if(!rows.length){toast('Add class names and valid times');return}S.courses.push(...rows);let origin=S.ocrOrigin;S.ocrCourses=[];S.ocrImage='';if(origin==='setupSchedule')go('profileSetup');else{S.tab='schedule';go('schedule')}toast(rows.length+' class(es) added')}

function today(){let d=new Date(),date=new Intl.DateTimeFormat('en-US',{month:'long',day:'numeric',year:'numeric'}).format(d);return `<div class="hero"><div class="date">${date} · ${new Intl.DateTimeFormat('en-US',{weekday:'long'}).format(d)}</div><h1>Good morning, ${S.user.split(' ')[0]} ☀️</h1><p>Make a little time to focus today.</p></div><div class="sectionHead"><h2>Today’s classes</h2><button class="textbtn" onclick="setTab('schedule')">View schedule →</button></div>${S.courses.filter(c=>c.day===1).map(c=>courseCard(c)).join('')||'<div class="empty">No classes today. Enjoy your free time! 🌿</div>'}<div class="sectionHead"><h2>Focus settings</h2><button class="textbtn" onclick="go('preferences')">Edit</button></div><div class="card"><div class="setting"><span>Class reminder</span><b>${S.reminder}</b></div><div class="setting"><span>Focus time</span><b>2 min demo</b></div><div class="setting" style="border:0"><span>Distracting apps</span><b>${S.apps.length} selected</b></div></div><button class="btn secondary" onclick="go('insight')">◷　View focus insights</button>`}

let timerId,breakId;function startTimer(){clearInterval(timerId);timerId=setInterval(()=>{if(S.page!=='timer'){clearInterval(timerId);return}S.secs--;let el=$('#countdown');if(el)el.textContent=fmt(S.secs);if(S.secs<=0){clearInterval(timerId);S.courses[S.focus].done=true;S.completed++;go('review')}},1000)}function startBreak(){clearInterval(breakId);breakId=setInterval(()=>{if(S.page!=='break'){clearInterval(breakId);return}S.breakSecs--;let el=$('#breakcount');if(el)el.textContent=fmt(S.breakSecs);if(S.breakSecs<=0){clearInterval(breakId);go('restdone')}},1000)}function fmt(n){return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}
function timer(){let c=S.courses[S.focus]||S.courses[0];return `${title('Focusing',false)}<div class="eyebrow" style="text-align:center">Focus in progress</div><h2 style="text-align:center">${c.name}</h2><div class="clock"><div class="clockinner"><b id="countdown">${fmt(S.secs)}</b><span>Focus time remaining</span></div></div><div class="subtle" style="text-align:center">🌿 Breathe deeply and bring your attention back to the present.</div><div class="spacer"></div><div class="row"><button class="btn secondary" onclick="S.breakSecs=30;go('break')">☕ Take a break</button><button class="btn secondary" onclick="go('review')">End class</button></div><div class="spacer"></div>${B('Complete demo class ✓',"S.courses[S.focus].done=true;S.completed++;go('review')")}`}

function schedule(){let ds=days.map((d,i)=>`<div class="dayhead">${d}</div>`).join('');let hrs=['09:00','10:00','11:00','12:00','13:00','14:00','15:00'];return `${title('Schedule',false)}<div class="week"><button onclick="S.week--;render()">‹</button><b>${S.week===0?'Oct 12–18':S.week>0?'Oct 19–25':'Oct 5–11'}</b><button onclick="S.week++;render()">›</button></div><div class="calendar"><div class="dayhead"></div>${ds}${hrs.map((h,idx)=>`<div class="timecell">${h}</div>${days.map((_,di)=>{let c=S.courses.find(c=>c.day===di+1&&parseInt(c.start)>=parseInt(h)&&parseInt(c.start)<parseInt(h)+1);return `<div class="gridcell">${c?`<div class="event ${di===2?'blue':''}" onclick="S.form=${S.courses.indexOf(c)};go('courseform')">${c.name}<br>${c.start}</div>`:''}</div>`}).join('')}`).join('')}</div><div class="sectionHead"><h2>This week’s classes</h2><button class="textbtn" onclick="S.form=null;go('courseform')">＋ Add</button></div><button class="btn secondary" onclick="S.ocrOrigin='schedule';document.querySelector('#scheduleImage').click()">▧　Import timetable screenshot</button><input id="scheduleImage" type="file" accept="image/*" hidden onchange="handleTimetableImage(event)">${S.courses.map(c=>`<div class="card course" onclick="S.form=${S.courses.indexOf(c)};go('courseform')"><div class="stripe"></div><div class="courseMain"><strong>${c.name}</strong><small>${days[c.day-1]||'Mon'} · ${c.place}</small></div><div class="courseTime">${c.start}</div></div>`).join('')}${B('＋ Add class',"S.form=null;go('courseform')")}`}

function groups(){return `${title('Study groups',false)}<p class="tiny">Build focused study time together.</p>${S.groups.map(g=>`<div class="card" style="cursor:pointer" onclick="S.group='${g.name}';go('groupdetail')"><div class="person"><div class="avatar">📚</div><div style="flex:1"><b>${g.name}</b><small>${g.members.length}  members</small></div><span>›</span></div></div>`).join('')||'<div class="empty">No groups yet. Create one to study together.</div>'}${B('＋ Create group',"go('groupform')")}<div class="spacer"></div>${B('Back','go(\'friends\')','secondary')}`}
function groupForm(){return `${title('Create group')}<div class="field"><label>Group name</label><input id="gname" placeholder="e.g. Finals Study Crew"></div>${B('Create group',"let n=document.querySelector('#gname').value.trim();if(!n){toast('Enter a group name');return}S.groups.push({name:n,members:[S.user]});S.group=n;go('groupdetail');toast('Group created')")}<div class="spacer"></div>${B('Back','go(\'groups\')','secondary')}`}
function groupDetail(){let g=S.groups.find(x=>x.name===S.group)||S.groups[0];return `${title(g?.name||'Study groups')}<div class="card"><div class="eyebrow">Group members · ${g?.members.length||0}</div>${(g?.members||[]).map((m,i)=>`<div class="setting"><span>${i===0?'🌱':'👤'}　${m}</span><span class="tiny">${i===0?'You':'Member'}</span></div>`).join('')}</div><div class="sectionHead"><h2>Pending invites</h2></div><div class="empty">No pending group invites.</div>${B('Invite friends',"toast('Group invite link copied')")}<div class="spacer"></div>${B('Back to groups','go(\'groups\')','secondary')}`}
function ranking(){return `${title('Rankings',false)}<div class="tabs"><button class="${S.rankTab==='Personal'?'sel':''}" onclick="S.rankTab='Personal';render()">Personal</button><button class="${S.rankTab==='Groups'?'sel':''}" onclick="S.rankTab='Groups';render()">My groups</button></div>${S.completed?`<div class="card person"><div class="avatar">${S.avatar}</div><div style="flex:1"><b>${S.user}</b><small>Completed this week:  ${S.completed} classes</small></div><b>#${Math.max(1,12-S.completed)}</b></div>`:S.rankTab==='Personal'?'<div class="empty"><span>🌱</span><p>Complete your first class to start earning a ranking.</p></div>':''}${S.rankTab==='Groups'?S.groups.map(g=>`<div class="card person"><div class="avatar">📚</div><div style="flex:1"><b>${g.name}</b><small>${g.members.length}  members · focused this week</small></div><b>#${S.completed?2:3}</b></div>`).join('')||'<div class="empty">Join or create a group to see its ranking.</div>':''}<div class="card"><div class="setting"><span>Join global rankings</span><button class="switch ${S.global?'on':''}" onclick="S.global=!S.global;render()"></button></div><p class="tiny">${S.global?'Your focus sessions will count toward global rankings.':'Global rankings are off. Your sessions will not appear publicly.'}</p></div><button class="textbtn" onclick="toast('Rankings are based on completed focus classes each week.')">Ranking rules ⓘ</button>`}
function profile(){return `${title('Personal',false)}<div class="card person"><div class="avatar" style="width:60px;height:60px;font-size:30px">${S.avatar}</div><div style="flex:1"><b>${S.user}</b><small>@${S.user.toLowerCase().replaceAll(' ','.')} · Sprout member</small></div><button class="textbtn" onclick="go('profileedit')">Edit</button></div><div class="sectionHead"><h2>Settings</h2></div><div class="card">${[['My Schedule','mycourseprefs','▦'],['Preferences','preferences','⚙'],['Study groups','groups','♧'],['My QR code','myqr','▧']].map(x=>`<div class="setting" style="cursor:pointer" onclick="go('${x[1]}')"><span>${x[2]}　${x[0]}</span><span>›</span></div>`).join('')}</div><div class="subtle">Sprout Focus　·　Make every focused moment count.</div>`}
function profileEdit(){return `${title('Edit profile')}<div class="field"><label>Name</label><input id="pname" value="${S.user}"></div><div class="field"><label>Avatar</label><div class="avatarpick">${['🌱','🌿','🍀','🌼','🪴','🌻'].map(a=>`<button class="${S.avatar===a?'sel':''}" onclick="S.avatar='${a}';render()">${a}</button>`).join('')}</div></div>${B('Save changes',"S.user=document.querySelector('#pname').value.trim()||S.user;go('profile');toast('Profile updated')")}<div class="spacer"></div>${B('Back','go(\'profile\')','secondary')}`}
function preferences(){return `${title('Preferences')}<div class="card">${[['My Schedule','mycourseprefs'],['Notifications','notifications'],['Reminder time','reminders'],['Distracting apps','apps']].map(x=>`<div class="setting" style="cursor:pointer" onclick="go('${x[1]}')"><span>${x[0]}</span><span>›</span></div>`).join('')}</div>${B('Back to profile','go(\'profile\')','secondary')}`}
function notifications(){return `${title('Notifications')}<div class="card"><div class="setting"><span>Class reminders</span><button class="switch ${S.notif?'on':''}" onclick="S.notif=!S.notif;render()"></button></div><p class="tiny">${S.notif?'Class reminders are on (Demo notifications are not sent)':'Reminders are off'}</p></div>${B('Save settings',"toast('Notification settings saved')")}<div class="spacer"></div>${B('Back to preferences','go(\'preferences\')','secondary')}`}
function reminders(){return `${title('Reminder time')}<div class="card">${['5 min before class','10 min before class','15 min before class','30 min before class'].map(x=>`<div class="setting" style="cursor:pointer" onclick="S.reminder='${x}';render();toast('Reminder time updated')"><span>${x}</span><b>${S.reminder===x?'✓':''}</b></div>`).join('')}</div>${B('Back to preferences','go(\'preferences\')','secondary')}`}
function apps(){return `${title('Distracting apps')}<p class="tiny">Choose apps that distract you during class.</p><div class="card">${S.apps.map((a,i)=>`<div class="setting"><span>◉　${a}</span><button class="textbtn" onclick="S.apps.splice(${i},1);render();toast('Removed ${a}')">Remove</button></div>`).join('')||'<div class="empty">No apps added yet</div>'}</div><div class="field"><label>Add app</label><div class="row"><input id="appname" placeholder="Enter an app name"><button class="btn primary" style="flex:0 0 92px" onclick="let a=document.querySelector('#appname').value.trim();if(a&&!S.apps.includes(a)){S.apps.push(a);render();toast('App added')}else toast('Enter a new app name')">Add</button></div></div>${B('Back to preferences','go(\'preferences\')','secondary')}`}
render();
</script></body></html>
