<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>芽伴 Focus</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap');
:root{--ink:#19352b;--muted:#82918a;--green:#286c50;--lime:#d9efaa;--bg:#f4f6f1;--card:#fff;--line:#e9eee8;--coral:#f3a18c;--shadow:0 24px 70px #19352b1c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% 10%,#e1ecd9 0,transparent 38%),#edf0e9;color:var(--ink);font-family:'DM Sans','Noto Sans TC',sans-serif;min-height:100vh}.shell{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:28px}.phone{width:390px;height:min(844px,calc(100vh - 56px));min-height:620px;background:var(--bg);border-radius:38px;box-shadow:var(--shadow);overflow:hidden;position:relative;border:7px solid white;display:flex;flex-direction:column}.status{height:34px;display:flex;justify-content:space-between;padding:8px 22px 0;font-size:11px;font-weight:700}.top{height:54px;padding:7px 22px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:16px;font-weight:800;letter-spacing:-.4px;display:flex;align-items:center;gap:8px}.sprout{width:30px;height:30px;border-radius:11px;background:var(--lime);display:grid;place-items:center;font-size:18px}.iconbtn,.back{border:0;background:white;border-radius:14px;width:38px;height:38px;font-size:17px;color:var(--ink);cursor:pointer}.content{overflow:auto;flex:1;padding:10px 20px 94px;scrollbar-width:none}.content::-webkit-scrollbar{display:none}.nav{position:absolute;bottom:0;left:0;right:0;height:76px;background:#ffffffed;backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 8px 11px}.nav button{border:0;background:none;color:#9aa69f;font:500 10px inherit;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:57px;cursor:pointer}.nav .active{color:var(--green);font-weight:700}.nav .ni{font-size:20px;line-height:23px}.titleRow{display:flex;align-items:center;gap:12px;margin:4px 0 18px}.titleRow h1{font-size:23px;margin:0;letter-spacing:-.6px}.eyebrow{font-size:11px;color:var(--muted);letter-spacing:1.1px;font-weight:700;text-transform:uppercase}.hero{background:var(--green);border-radius:25px;padding:22px;color:white;position:relative;overflow:hidden;min-height:176px}.hero:after{content:'✳';position:absolute;color:#8bb69c55;font-size:142px;right:-10px;top:-45px}.hero h1{font-size:28px;line-height:1.24;margin:8px 0}.hero p{font-size:13px;color:#d0e1d6;margin:0}.date{font-size:12px;color:#cce0d3}.sectionHead{display:flex;justify-content:space-between;align-items:center;margin:23px 2px 12px}.sectionHead h2{font-size:16px;margin:0}.textbtn{border:0;background:none;color:var(--green);font:700 12px inherit;cursor:pointer}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:11px}.course{display:flex;align-items:center;gap:12px;cursor:pointer}.stripe{width:4px;height:50px;border-radius:5px;background:#9ec17c}.stripe.blue{background:#89aec5}.courseMain{flex:1;min-width:0}.courseMain strong{display:block;font-size:14px}.courseMain small{font-size:11px;color:var(--muted)}.courseTime{font-size:12px;font-weight:700;text-align:right;white-space:nowrap}.pill{display:inline-flex;padding:5px 9px;border-radius:99px;background:#edf4e7;color:#4b7951;font-size:10px;font-weight:700}.pill.gray{background:#f0f2ef;color:#7d8981}.pill.orange{background:#fff1e9;color:#bf7459}.btn{width:100%;border:0;border-radius:15px;padding:15px;font:700 14px inherit;cursor:pointer;transition:.18s;min-height:48px}.primary{background:var(--green);color:white;box-shadow:0 8px 18px #286c502b}.primary:hover{background:#1d593f;transform:translateY(-1px)}.secondary{background:white;color:var(--ink);border:1px solid var(--line)}.danger{color:#aa5a4d;background:#fff0ed}.row{display:flex;gap:10px}.row>*{flex:1}.tiny{font-size:11px;color:var(--muted)}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f0f5ec;border-radius:16px;padding:13px}.stat b{font-size:19px;display:block}.stat span{font-size:10px;color:var(--muted)}.field{margin:12px 0}.field label{font-size:12px;font-weight:700;display:block;margin:0 0 7px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:white;border-radius:12px;padding:12px 13px;font:13px inherit;color:var(--ink);outline:none}.field input:focus,.field select:focus{border-color:#74a485;box-shadow:0 0 0 3px #dbe9dd}.field textarea{min-height:85px;resize:vertical}.tabs{display:flex;background:#e9eee7;border-radius:13px;padding:4px;margin:8px 0 16px}.tabs button{flex:1;border:0;background:none;padding:9px;border-radius:10px;color:var(--muted);font:700 11px inherit;cursor:pointer}.tabs .sel{background:white;color:var(--ink);box-shadow:0 2px 5px #10251a0c}.toast{position:absolute;z-index:5;top:54px;left:50%;transform:translate(-50%,-20px);opacity:0;pointer-events:none;background:#19352b;color:white;padding:11px 16px;border-radius:12px;font-size:12px;transition:.25s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}.clock{width:205px;height:205px;margin:22px auto;background:conic-gradient(var(--green) var(--pct,78%),#e2e9df 0);border-radius:50%;display:grid;place-items:center;position:relative}.clock:before{content:'';position:absolute;inset:9px;background:var(--bg);border-radius:50%}.clockinner{position:relative;text-align:center}.clockinner b{display:block;font-size:40px;letter-spacing:-1px}.clockinner span{font-size:11px;color:var(--muted)}.mood{display:flex;gap:8px}.mood button{flex:1;border:1px solid var(--line);background:white;border-radius:14px;padding:12px 4px;font-size:12px;cursor:pointer}.mood .chosen{border-color:var(--green);background:#eaf2e8}.avatar{width:48px;height:48px;border-radius:17px;background:#e5efcb;display:grid;place-items:center;font-size:24px}.person{display:flex;gap:12px;align-items:center}.person b{font-size:14px}.person small{display:block;color:var(--muted);font-size:11px}.setting{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);font-size:13px}.switch{width:42px;height:24px;background:#dce3db;border-radius:99px;border:0;padding:3px;cursor:pointer}.switch:after{content:'';display:block;width:18px;height:18px;border-radius:50%;background:white;transition:.2s}.switch.on{background:var(--green)}.switch.on:after{transform:translateX(18px)}.calendar{display:grid;grid-template-columns:34px repeat(5,1fr);gap:4px}.dayhead{text-align:center;font-size:10px;color:var(--muted);padding:7px 0}.timecell{height:52px;font-size:9px;color:#9ba69e;padding-top:4px}.gridcell{height:52px;border-top:1px solid var(--line);position:relative}.event{background:#dfead3;border-radius:7px;padding:5px;font-size:9px;line-height:1.3;cursor:pointer;position:absolute;inset:3px 0;overflow:hidden;color:#315542}.event.blue{background:#e0ebf1;color:#395e71}.week{display:flex;justify-content:space-between;align-items:center;margin:8px 0 14px}.week button{border:0;background:white;border-radius:10px;padding:7px 12px;cursor:pointer}.empty{text-align:center;padding:25px 12px;color:var(--muted)}.empty span{font-size:32px}.avatarpick{display:flex;gap:9px}.avatarpick button{width:53px;height:53px;border:1px solid var(--line);border-radius:17px;background:white;font-size:25px;cursor:pointer}.avatarpick button.sel{border:2px solid var(--green);background:#eff6e8}.subtle{background:#eef3eb;border-radius:15px;padding:13px;font-size:12px;color:#587260;line-height:1.5}.spacer{height:10px}.footnote{text-align:center;color:#9aa69f;font-size:10px;padding:12px}
</style></head><body><div class="shell"><main class="phone"><div class="status"><span>9:41</span><span>●●●  ◉</span></div><header class="top"><div class="brand"><span class="sprout">🌱</span>芽伴 Focus</div><button class="iconbtn" onclick="go('profile')" aria-label="個人資料">☺</button></header><div id="toast" class="toast"></div><section id="content" class="content"></section><nav id="nav" class="nav"></nav></main></div><script>
const days=['一','二','三','四','五'];const seedCourses=[{name:'設計研究',teacher:'陳老師',place:'Room 402',day:1,start:'09:00',end:'10:00',done:false},{name:'互動設計',teacher:'林老師',place:'Studio B',day:1,start:'13:00',end:'14:00',done:false}];let S={page:'welcome',tab:'today',onboard:0,courses:structuredClone(seedCourses),user:'Alex Chen',avatar:'🌱',global:true,notif:true,reminder:'上課前 10 分鐘',apps:['Instagram','TikTok','YouTube'],friends:[{name:'Mia Wong',status:'已成為好友'},{name:'Jordan Lee',status:'已成為好友'}],incoming:1,groups:[{name:'Lecture Club',members:['Alex Chen','Mia Wong','Jordan Lee']}],group:null,focus:null,secs:120,breakSecs:30,completed:0,mood:'',week:0,rankTab:'個人',friendStep:'list',friendId:'',invite:null,form:null};const $=s=>document.querySelector(s);const content=$('#content');const nav=$('#nav');
function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1900)}function go(p){S.page=p;render()}function setTab(t){S.tab=t;S.page=t;render()}function back(){if(S.page==='plan')go('today');else if(S.page==='timer'||S.page==='break'||S.page==='restdone')go('plan');else if(S.page==='review')go('today');else if(['courseform'].includes(S.page))go('schedule');else if(['friendform','frienddetail','scan','myqr','invites'].includes(S.page))go('friends');else if(S.page==='groupdetail'||S.page==='groupform')go('groups');else if(['profileedit','preferences','mycourseprefs','notifications','reminders','apps'].includes(S.page))go('profile');else if(S.page==='insight')go('today');else go(S.tab)}function title(t,ret=true){return `<div class="titleRow">${ret?'<button class="back" onclick="back()">‹</button>':''}<h1>${t}</h1></div>`}function B(label,fn,cls='primary'){return `<button class="btn ${cls}" onclick="${fn}">${label}</button>`}function navset(){let arr=[['today','⌂','Today'],['schedule','▦','課表'],['friends','♡','好友'],['ranking','♜','排名'],['profile','☺','個人']];nav.style.display=['welcome','guide','setupSchedule','importPreview','courseform','profileSetup','avatarSetup'].includes(S.page)?'none':'flex';nav.innerHTML=arr.map(([p,i,n])=>`<button class="${S.tab===p?'active':''}" onclick="setTab('${p}')"><span class="ni">${i}</span>${n}</button>`).join('')}
function render(){navset();let v='';switch(S.page){case'welcome':v=welcome();break;case'guide':v=guide();break;case'setupSchedule':v=setupSchedule();break;case'importPreview':v=importPreview();break;case'profileSetup':v=profileSetup();break;case'avatarSetup':v=avatarSetup();break;case'today':v=today();break;case'plan':v=plan();break;case'timer':v=timer();break;case'break':v=breakPage();break;case'restdone':v=restDone();break;case'review':v=review();break;case'insight':v=insight();break;case'schedule':v=schedule();break;case'courseform':v=courseForm();break;case'friends':v=friends();break;case'friendform':v=friendForm();break;case'frienddetail':v=friendDetail();break;case'scan':v=scan();break;case'myqr':v=myqr();break;case'invites':v=invites();break;case'groups':v=groups();break;case'groupform':v=groupForm();break;case'groupdetail':v=groupDetail();break;case'ranking':v=ranking();break;case'profile':v=profile();break;case'profileedit':v=profileEdit();break;case'preferences':v=preferences();break;case'mycourseprefs':v=title('我的課表')+`<div class="card"><div class="setting"><span>每週課程</span><b>${S.courses.length} 堂</b></div><div class="setting"><span>課表管理</span><button class="textbtn" onclick="go('schedule')">查看課表 →</button></div></div>`;break;case'notifications':v=notifications();break;case'reminders':v=reminders();break;case'apps':v=apps();break;default:v=today()}content.innerHTML=v;content.scrollTop=0;if(S.page==='timer')startTimer();if(S.page==='break')startBreak()}
function welcome(){return `<div style="height:28px"></div><div class="hero" style="min-height:280px;display:flex;flex-direction:column;justify-content:end"><div style="font-size:60px">🌱</div><span class="eyebrow" style="color:#cce0d3">STUDY WITH INTENTION</span><h1>把專注，<br>還給自己。</h1><p>芽伴陪你踏實上好每一堂課。</p></div><div class="spacer"></div><div class="subtle">🌿 建立你的課表，開始一段更專注的學習旅程。</div><div style="height:22px"></div>${B('開始設定 →',"go('guide')")}<p class="footnote">不需登入 · 所有資料僅供 Demo 展示</p>`}
function guide(){let items=[['一點一點，回到專注','芽伴會在課堂開始前提醒你，並陪你記錄每次專注。','🌱'],['幫娛樂 App 按下暫停','選擇容易讓你分心的 App，上課時把注意力留給自己。','◉'],['提醒，在剛好的時候','設定你希望收到提醒的時間。Demo 不會傳送真實通知。','🔔']];let [h,p,icon]=items[S.onboard];return `${title('使用指南')}<div class="eyebrow">${S.onboard+1} / 3</div><div style="text-align:center;padding:45px 15px 38px"><div style="font-size:72px">${icon}</div><h1 style="font-size:25px">${h}</h1><p style="color:var(--muted);font-size:14px;line-height:1.8">${p}</p></div><div class="tabs">${items.map((_,i)=>`<button class="${S.onboard===i?'sel':''}" onclick="S.onboard=${i};render()">${i+1}</button>`).join('')}</div>${B(S.onboard<2?'下一步 →':'設定課表 →',"S.onboard<2?(S.onboard++,render()):go('setupSchedule')")}<div class="spacer"></div>${B('返回','S.onboard? (S.onboard--,render()):go(\'welcome\')','secondary')}`}
function setupSchedule(){return `${title('設定課表')}<p class="tiny">選擇匯入示範課表，或自行新增課程。</p><div class="card" style="margin-top:20px"><div style="font-size:28px">▦</div><h3>匯入示範課表</h3><p class="tiny">使用預設課程資料，快速完成設定。</p>${B('預覽課表','go(\'importPreview\')')}</div><div class="card"><div style="font-size:28px">＋</div><h3>手動新增課程</h3><p class="tiny">依照你的上課時間建立課表。</p>${B('新增第一堂課','S.form=null;go(\'courseform\')','secondary')}</div>${B('稍後設定','go(\'profileSetup\')','secondary')}`}
function importPreview(){return `${title('匯入預覽')}<div class="subtle">以下為 Demo 示範資料，可在課表頁繼續編輯。</div><div style="height:12px"></div>${seedCourses.map(c=>courseCard(c,false)).join('')}${B('確認匯入並繼續','S.courses=structuredClone(seedCourses);go(\'profileSetup\')')}<div class="spacer"></div>${B('返回','go(\'setupSchedule\')','secondary')}`}
function profileSetup(){return `${title('個人資料')}<p class="tiny">讓朋友知道你是誰。</p><div class="field"><label>你的名字</label><input id="setupName" value="${S.user}" placeholder="輸入名字"></div>${B('下一步 →',"S.user=document.querySelector('#setupName').value.trim()||'Alex Chen';go('avatarSetup')")}<div class="spacer"></div>${B('返回','go(\'setupSchedule\')','secondary')}`}
function avatarSetup(){return `${title('選擇頭像')}<div class="person" style="justify-content:center;padding:32px"><div class="avatar" style="width:82px;height:82px;font-size:40px">${S.avatar}</div></div><p class="tiny" style="text-align:center">選擇一個代表你的頭像</p><div class="avatarpick" style="justify-content:center;margin:15px 0">${['🌱','🌿','🍀','🌼','🪴','🌻'].map(a=>`<button class="${S.avatar===a?'sel':''}" onclick="S.avatar='${a}';render()">${a}</button>`).join('')}</div><div class="card" style="text-align:center;cursor:pointer" onclick="toast('已選擇預設照片')">▧　選擇照片 <span class="tiny">（使用 Demo 預設圖片）</span></div>${B('完成設定 →',"S.tab='today';go('today');toast('設定完成，歡迎加入芽伴！')")}<div class="spacer"></div>${B('返回','go(\'profileSetup\')','secondary')}`}
function courseCard(c,click=true){return `<div class="card course" ${click?`onclick="S.focus=${S.courses.indexOf(c)};go('plan')"`:''}><div class="stripe ${c.day===3?'blue':''}"></div><div class="courseMain"><strong>${c.name}</strong><small>${c.place} · ${c.teacher||'教師未設定'}</small></div><div><div class="courseTime">${c.start}–${c.end}</div><span class="pill ${c.done?'gray':''}">${c.done?'已完成':'尚未開始'}</span></div></div>`}
function today(){let d=new Date(),date=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;return `<div class="hero"><div class="date">${date}　·　星期${'日一二三四五六'[d.getDay()]}</div><h1>早安，${S.user.split(' ')[0]} ☀️</h1><p>今天也為自己留一點專注時間。</p></div><div class="sectionHead"><h2>今日課程</h2><button class="textbtn" onclick="setTab('schedule')">查看課表 →</button></div>${S.courses.filter(c=>c.day===1).map(c=>courseCard(c)).join('')||'<div class="empty">今天沒有課程，享受你的空檔吧 🌿</div>'}<div class="sectionHead"><h2>專注設定</h2><button class="textbtn" onclick="go('preferences')">編輯</button></div><div class="card"><div class="setting"><span>課前提醒</span><b>${S.reminder}</b></div><div class="setting"><span>專注時間</span><b>2 分鐘示範</b></div><div class="setting" style="border:0"><span>娛樂 App</span><b>${S.apps.length} 個</b></div></div><button class="btn secondary" onclick="go('insight')">◷　查看專注洞察</button>`}
function plan(){let c=S.courses[S.focus]||S.courses[0];return `${title('專注計畫')}<div class="eyebrow">即將開始</div><h1 style="font-size:24px;margin:8px 0">${c.name}</h1><p class="tiny">${c.start}–${c.end}　·　${c.place}</p><div class="clock" style="--pct:100%"><div class="clockinner"><b>02:00</b><span>示範專注時間</span></div></div><div class="sectionHead"><h2>你的專注設定</h2></div><div class="card"><div class="setting"><span>課前提醒</span><b>${S.reminder}</b></div><div class="setting"><span>休息時間</span><b>30 秒</b></div><div class="setting" style="border:0"><span>暫停娛樂 App</span><b>${S.apps.slice(0,2).join('、')||'未設定'}</b></div></div>${B('開始專注',"S.secs=120;go('timer')")}<div class="spacer"></div>${B('返回','go(\'today\')','secondary')}`}
let timerId,breakId;function startTimer(){clearInterval(timerId);timerId=setInterval(()=>{if(S.page!=='timer'){clearInterval(timerId);return}S.secs--;let el=$('#countdown');if(el)el.textContent=fmt(S.secs);if(S.secs<=0){clearInterval(timerId);S.courses[S.focus].done=true;S.completed++;go('review')}},1000)}function startBreak(){clearInterval(breakId);breakId=setInterval(()=>{if(S.page!=='break'){clearInterval(breakId);return}S.breakSecs--;let el=$('#breakcount');if(el)el.textContent=fmt(S.breakSecs);if(S.breakSecs<=0){clearInterval(breakId);go('restdone')}},1000)}function fmt(n){return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}
function timer(){let c=S.courses[S.focus]||S.courses[0];return `${title('專注中',false)}<div class="eyebrow" style="text-align:center">正在專注</div><h2 style="text-align:center">${c.name}</h2><div class="clock"><div class="clockinner"><b id="countdown">${fmt(S.secs)}</b><span>剩餘專注時間</span></div></div><div class="subtle" style="text-align:center">🌿 深呼吸，把注意力帶回眼前。</div><div class="spacer"></div><div class="row"><button class="btn secondary" onclick="S.breakSecs=30;go('break')">☕ 開始休息</button><button class="btn secondary" onclick="go('review')">結束課程</button></div><div class="spacer"></div>${B('完成示範課程 ✓',"S.courses[S.focus].done=true;S.completed++;go('review')")}`}
function breakPage(){return `${title('休息一下',false)}<div style="text-align:center;padding:22px 0"><div style="font-size:54px">☕</div><h2>讓大腦喘口氣</h2><p class="tiny">短暫休息，等等再回到課程。</p></div><div class="clock" style="--pct:70%"><div class="clockinner"><b id="breakcount">${fmt(S.breakSecs)}</b><span>休息倒數</span></div></div>${B('提早結束休息','go(\'restdone\')')}</div>`}
function restDone(){return `${title('休息結束')}<div style="text-align:center;padding:55px 10px"><div style="font-size:60px">🌤️</div><h1>準備好了嗎？</h1><p class="tiny">回到課程，完成今天的小目標。</p></div>${B('回到課程',"S.secs=120;go('timer')")}`}
function review(){let c=S.courses[S.focus]||S.courses[0];return `${title('課後回顧',false)}<div class="subtle">${c.name}　·　${c.start}–${c.end}<br>🌱 課程${c.done?'已完成':'已結束'}，做得很好！</div><div class="sectionHead"><h2>這堂課感覺如何？</h2></div><div class="mood">${['專注','普通','分心'].map((x,i)=>`<button class="${S.mood===x?'chosen':''}" onclick="S.mood='${x}';render()">${['✦','◒','〰'][i]}<br>${x}</button>`).join('')}</div><div class="field"><label>課後備註（可略過）</label><textarea id="note" placeholder="記下今天的收穫…"></textarea></div>${B('儲存並查看洞察',"if(!S.mood){toast('請選擇專注感受');return}S.lastNote=document.querySelector('#note').value;go('insight')")}<div class="spacer"></div>${B('略過回顧','go(\'insight\')','secondary')}`}
function insight(){return `${title('專注洞察',false)}<div class="hero" style="min-height:152px"><div class="eyebrow" style="color:#cce0d3">本週學習</div><h1>每一次專注，<br>都算數。</h1><p>繼續累積你的學習節奏。</p></div><div class="summary" style="margin:14px 0"><div class="stat"><b>${S.completed}</b><span>完成課程</span></div><div class="stat"><b>${S.completed*2} 分</b><span>專注時間</span></div></div><div class="sectionHead"><h2>近期專注</h2></div>${S.completed?`<div class="card"><b>${S.courses[S.focus]?.name||'示範課程'}</b><p class="tiny">今天 · 2 分鐘 · 感受：${S.mood||'已完成'}</p></div>`:'<div class="empty"><span>🌱</span><p>完成第一堂課後，這裡會出現你的專注紀錄。</p></div>'}${B('回到 Today',"S.tab='today';go('today')")}<div class="spacer"></div>${B('查看排名','setTab(\'ranking\')','secondary')}`}
function schedule(){let ds=days.map((d,i)=>`<div class="dayhead">${d}</div>`).join('');let hrs=['09:00','10:00','11:00','12:00','13:00','14:00','15:00'];return `${title('課表',false)}<div class="week"><button onclick="S.week--;render()">‹</button><b>${S.week===0?'10月 12 – 18 日':S.week>0?'10月 19 – 25 日':'10月 5 – 11 日'}</b><button onclick="S.week++;render()">›</button></div><div class="calendar"><div class="dayhead"></div>${ds}${hrs.map((h,idx)=>`<div class="timecell">${h}</div>${days.map((_,di)=>{let c=S.courses.find(c=>c.day===di+1&&parseInt(c.start)>=parseInt(h)&&parseInt(c.start)<parseInt(h)+1);return `<div class="gridcell">${c?`<div class="event ${di===2?'blue':''}" onclick="S.form=${S.courses.indexOf(c)};go('courseform')">${c.name}<br>${c.start}</div>`:''}</div>`}).join('')}`).join('')}</div><div class="sectionHead"><h2>本週課程</h2><button class="textbtn" onclick="S.form=null;go('courseform')">＋ 新增</button></div>${S.courses.map(c=>`<div class="card course" onclick="S.form=${S.courses.indexOf(c)};go('courseform')"><div class="stripe"></div><div class="courseMain"><strong>${c.name}</strong><small>星期${days[c.day-1]||'一'} · ${c.place}</small></div><div class="courseTime">${c.start}</div></div>`).join('')}${B('＋ 新增課程',"S.form=null;go('courseform')")}`}
function courseForm(){let c=S.form===null?{name:'',teacher:'',place:'',day:1,start:'09:00',end:'10:00'}:S.courses[S.form];return `${title(S.form===null?'新增課程':'編輯課程')}<div class="field"><label>課程名稱</label><input id="cname" value="${c.name}" placeholder="例如：設計研究"></div><div class="field"><label>教師</label><input id="teacher" value="${c.teacher||''}" placeholder="教師姓名"></div><div class="field"><label>地點</label><input id="place" value="${c.place}" placeholder="教室或地點"></div><div class="field"><label>星期</label><select id="day">${days.map((d,i)=>`<option value="${i+1}" ${c.day===i+1?'selected':''}>星期${d}</option>`).join('')}</select></div><div class="row"><div class="field"><label>開始時間</label><input type="time" id="start" value="${c.start}"></div><div class="field"><label>結束時間</label><input type="time" id="end" value="${c.end}"></div></div>${B('儲存課程',"saveCourse()")}<div class="spacer"></div>${B('取消','go(\'schedule\')','secondary')}${S.form!==null?`<div class="spacer"></div>${B('刪除課程',"S.courses.splice(S.form,1);S.form=null;go('schedule');toast('課程已刪除')",'danger')}`:''}`}
function saveCourse(){let name=$('#cname').value.trim(),start=$('#start').value,end=$('#end').value;if(!name){toast('請填寫課程名稱');return}if(!start||!end||end<=start){toast('請確認課程時間');return}let o={name,teacher:$('#teacher').value.trim(),place:$('#place').value.trim()||'未設定地點',day:+$('#day').value,start,end,done:false};if(S.form===null)S.courses.push(o);else S.courses[S.form]=o;S.form=null;S.tab='schedule';go('schedule');toast('課程已儲存')}
function friends(){return `${title('好友',false)}<div class="hero" style="min-height:135px"><div class="eyebrow" style="color:#cce0d3">一起學習</div><h1>有人同行，<br>專注更有力。</h1></div><div class="row" style="margin:12px 0"><button class="btn secondary" onclick="go('friendform')">＋ 新增好友</button><button class="btn secondary" onclick="go('scan')">▦ 掃描 QR</button></div><div class="sectionHead"><h2>我的好友 <span class="tiny">${S.friends.length}</span></h2></div>${S.friends.map(f=>`<div class="card person"><div class="avatar">${f.name.startsWith('M')?'👩🏻':'👨🏻'}</div><div style="flex:1"><b>${f.name}</b><small>${f.status}</small></div><span>›</span></div>`).join('')}<div class="card person" style="cursor:pointer" onclick="go('invites')"><div class="avatar">✉️</div><div style="flex:1"><b>待處理邀請</b><small>${S.incoming} 筆好友邀請</small></div><span>›</span></div><div class="row"><button class="btn secondary" onclick="go('myqr')">我的 QR code</button><button class="btn secondary" onclick="go('groups')">讀書小組</button></div>`}
function friendForm(){return `${title('新增好友')}<p class="tiny">輸入好友的芽伴 ID，找到後即可送出邀請。</p><div class="field"><label>好友 ID</label><input id="fid" placeholder="例如：mia.wong" value="${S.friendId}"></div>${B('搜尋好友',"S.friendId=document.querySelector('#fid').value.trim();if(!S.friendId){toast('請輸入好友 ID')}else if(S.friendId.toLowerCase().includes('none')||S.friendId==='404'){S.friendStep='error';render()}else{S.friendStep='found';render()}")}${S.friendStep==='error'?'<div class="subtle" style="margin-top:12px;color:#ae6652">找不到這位使用者，請確認 ID 後再試一次。</div>':''}${S.friendStep==='found'?`<div class="card person" style="margin-top:14px"><div class="avatar">👩🏻</div><div style="flex:1"><b>Mia Wong</b><small>@mia.wong · 設計系</small></div><span class="pill">芽伴使用者</span></div>${B('送出好友邀請',"S.invite='Mia Wong';S.friendStep='sent';render()")}`:''}${S.friendStep==='sent'?'<div class="subtle" style="margin-top:12px">✓ 邀請已送出，等待對方接受。</div>':''}<div class="spacer"></div>${B('返回好友','go(\'friends\')','secondary')}`}
function friendDetail(){return `${title('好友資料')}<div class="card person"><div class="avatar">👩🏻</div><div><b>Mia Wong</b><small>設計系 · 專注中</small></div></div>${B('送出好友邀請',"toast('邀請已送出')")}<div class="spacer"></div>${B('返回','go(\'friends\')','secondary')}`}
function scan(){return `${title('掃描 QR code')}<div style="height:80px"></div><div class="card" style="margin:auto;text-align:center;padding:40px 20px"><div style="font-size:70px">▦</div><h3>Demo 掃描完成</h3><p class="tiny">已找到示範好友 Mia Wong</p>${B('查看好友資料','go(\'frienddetail\')')}</div><div class="spacer"></div>${B('返回好友','go(\'friends\')','secondary')}`}
function myqr(){return `${title('我的 QR code')}<div class="card" style="text-align:center;padding:34px"><div style="font-size:150px;line-height:1">▦</div><h3>${S.user}</h3><p class="tiny">讓朋友掃描 QR code 加入你</p></div>${B('返回好友','go(\'friends\')','secondary')}`}
function invites(){return `${title('待處理邀請')}<div class="card person"><div class="avatar">👩🏻</div><div style="flex:1"><b>Sam Chen</b><small>想加你為好友</small></div><button class="textbtn" onclick="S.friends.push({name:'Sam Chen',status:'已成為好友'});S.incoming=0;render();toast('已接受好友邀請')">接受</button></div>${B('返回好友','go(\'friends\')','secondary')}`}
function groups(){return `${title('讀書小組',false)}<p class="tiny">和夥伴一起累積專注時光。</p>${S.groups.map(g=>`<div class="card" style="cursor:pointer" onclick="S.group='${g.name}';go('groupdetail')"><div class="person"><div class="avatar">📚</div><div style="flex:1"><b>${g.name}</b><small>${g.members.length} 位成員</small></div><span>›</span></div></div>`).join('')||'<div class="empty">還沒有小組，建立一個開始共讀吧。</div>'}${B('＋ 建立小組',"go('groupform')")}<div class="spacer"></div>${B('返回','go(\'friends\')','secondary')}`}
function groupForm(){return `${title('建立小組')}<div class="field"><label>小組名稱</label><input id="gname" placeholder="例如：期末一起衝"></div>${B('建立小組',"let n=document.querySelector('#gname').value.trim();if(!n){toast('請輸入小組名稱');return}S.groups.push({name:n,members:[S.user]});S.group=n;go('groupdetail');toast('小組已建立')")}<div class="spacer"></div>${B('返回','go(\'groups\')','secondary')}`}
function groupDetail(){let g=S.groups.find(x=>x.name===S.group)||S.groups[0];return `${title(g?.name||'讀書小組')}<div class="card"><div class="eyebrow">小組成員 · ${g?.members.length||0}</div>${(g?.members||[]).map((m,i)=>`<div class="setting"><span>${i===0?'🌱':'👤'}　${m}</span><span class="tiny">${i===0?'你':'成員'}</span></div>`).join('')}</div><div class="sectionHead"><h2>待處理邀請</h2></div><div class="empty">目前沒有待處理的小組邀請</div>${B('邀請好友加入',"toast('已複製小組邀請連結')")}<div class="spacer"></div>${B('返回小組列表','go(\'groups\')','secondary')}`}
function ranking(){return `${title('排名',false)}<div class="tabs"><button class="${S.rankTab==='個人'?'sel':''}" onclick="S.rankTab='個人';render()">個人排名</button><button class="${S.rankTab==='小組'?'sel':''}" onclick="S.rankTab='小組';render()">我的群組</button></div>${S.completed?`<div class="card person"><div class="avatar">${S.avatar}</div><div style="flex:1"><b>${S.user}</b><small>本週完成 ${S.completed} 堂課</small></div><b>#${Math.max(1,12-S.completed)}</b></div>`:S.rankTab==='個人'?'<div class="empty"><span>🌱</span><p>完成第一堂課後，就會開始累積你的排名。</p></div>':''}${S.rankTab==='小組'?S.groups.map(g=>`<div class="card person"><div class="avatar">📚</div><div style="flex:1"><b>${g.name}</b><small>${g.members.length} 位成員 · 本週專注</small></div><b>#${S.completed?2:3}</b></div>`).join('')||'<div class="empty">加入或建立小組後即可查看排名。</div>':''}<div class="card"><div class="setting"><span>全球排名參與</span><button class="switch ${S.global?'on':''}" onclick="S.global=!S.global;render()"></button></div><p class="tiny">${S.global?'你的專注紀錄會參與全球排名。':'全球參與已關閉，你的紀錄不會顯示於全球排名。'}</p></div><button class="textbtn" onclick="toast('排名依每週完成的專注課程數計算。')">排名規則說明 ⓘ</button>`}
function profile(){return `${title('個人',false)}<div class="card person"><div class="avatar" style="width:60px;height:60px;font-size:30px">${S.avatar}</div><div style="flex:1"><b>${S.user}</b><small>@${S.user.toLowerCase().replaceAll(' ','.')} · 芽伴會員</small></div><button class="textbtn" onclick="go('profileedit')">編輯</button></div><div class="sectionHead"><h2>設定</h2></div><div class="card">${[['我的課表','mycourseprefs','▦'],['偏好設定','preferences','⚙'],['讀書小組','groups','♧'],['我的 QR code','myqr','▧']].map(x=>`<div class="setting" style="cursor:pointer" onclick="go('${x[1]}')"><span>${x[2]}　${x[0]}</span><span>›</span></div>`).join('')}</div><div class="subtle">芽伴 Focus　·　讓每一次專注都有回響。</div>`}
function profileEdit(){return `${title('編輯個人資料')}<div class="field"><label>姓名</label><input id="pname" value="${S.user}"></div><div class="field"><label>頭像</label><div class="avatarpick">${['🌱','🌿','🍀','🌼','🪴','🌻'].map(a=>`<button class="${S.avatar===a?'sel':''}" onclick="S.avatar='${a}';render()">${a}</button>`).join('')}</div></div>${B('儲存變更',"S.user=document.querySelector('#pname').value.trim()||S.user;go('profile');toast('個人資料已更新')")}<div class="spacer"></div>${B('返回','go(\'profile\')','secondary')}`}
function preferences(){return `${title('偏好設定')}<div class="card">${[['我的課表','mycourseprefs'],['通知設定','notifications'],['提醒時間','reminders'],['娛樂 App 設定','apps']].map(x=>`<div class="setting" style="cursor:pointer" onclick="go('${x[1]}')"><span>${x[0]}</span><span>›</span></div>`).join('')}</div>${B('返回個人頁','go(\'profile\')','secondary')}`}
function notifications(){return `${title('通知設定')}<div class="card"><div class="setting"><span>課程提醒</span><button class="switch ${S.notif?'on':''}" onclick="S.notif=!S.notif;render()"></button></div><p class="tiny">${S.notif?'上課前提醒已開啟（Demo 不會傳送真實通知）':'提醒已關閉'}</p></div>${B('儲存設定',"toast('通知設定已儲存')")}<div class="spacer"></div>${B('返回偏好設定','go(\'preferences\')','secondary')}`}
function reminders(){return `${title('提醒時間')}<div class="card">${['上課前 5 分鐘','上課前 10 分鐘','上課前 15 分鐘','上課前 30 分鐘'].map(x=>`<div class="setting" style="cursor:pointer" onclick="S.reminder='${x}';render();toast('提醒時間已更新')"><span>${x}</span><b>${S.reminder===x?'✓':''}</b></div>`).join('')}</div>${B('返回偏好設定','go(\'preferences\')','secondary')}`}
function apps(){return `${title('娛樂 App 設定')}<p class="tiny">選擇上課時容易讓你分心的 App。</p><div class="card">${S.apps.map((a,i)=>`<div class="setting"><span>◉　${a}</span><button class="textbtn" onclick="S.apps.splice(${i},1);render();toast('已移除 ${a}')">移除</button></div>`).join('')||'<div class="empty">尚未加入 App</div>'}</div><div class="field"><label>新增 App</label><div class="row"><input id="appname" placeholder="輸入 App 名稱"><button class="btn primary" style="flex:0 0 92px" onclick="let a=document.querySelector('#appname').value.trim();if(a&&!S.apps.includes(a)){S.apps.push(a);render();toast('App 已新增')}else toast('請輸入新的 App 名稱')">新增</button></div></div>${B('返回偏好設定','go(\'preferences\')','secondary')}`}
render();
</script></body></html>
