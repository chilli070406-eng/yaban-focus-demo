function copyText(text){if(native('copy',{text}))return;const copy=navigator.clipboard?.writeText(text);if(copy)copy.then(()=>toast('Copied')).catch(()=>copyFallback(text));else copyFallback(text)}
function copyFallback(text){let e=document.createElement('textarea');e.value=text;document.body.append(e);e.select();document.execCommand('copy');e.remove();toast('Copied')}

function mins(t){let [h,m]=String(t||'').split(':').map(Number);return h*60+m}
function duration(c){const value=mins(c.end)-mins(c.start);return Number.isFinite(value)&&value>0?value:0}
function ampm(t){let n=typeof t==='number'?t/60:mins(t),h=Math.floor(n/60)%24,m=Math.floor(n%60);return (h%12||12)+':'+String(m).padStart(2,'0')+' '+(h>=12?'PM':'AM')}
function fmt(n){n=Math.max(0,Math.floor(n));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function dateFromDay(day){return new Date(2026,9,12+day)}
function fullDate(d){return new Intl.DateTimeFormat('en-US',{weekday:'short',month:'short',day:'numeric'}).format(d)}
function weekRange(week=S.week,lastDay=5){let a=dateFromDay(week*7),b=dateFromDay(week*7+lastDay-1);return new Intl.DateTimeFormat('en-US',{month:'long',day:'numeric'}).format(a)+'–'+b.getDate()}
function rankRange(){let a=new Date(2026,9,6+S.rankWeek*7),b=new Date(2026,9,12+S.rankWeek*7);return new Intl.DateTimeFormat('en-US',{month:'long',day:'numeric'}).format(a)+'–'+b.getDate()}
function periodRecords(){let a=new Date(2026,9,6+S.rankWeek*7),b=new Date(2026,9,12+S.rankWeek*7,23,59,59);return S.records.filter(r=>{let d=new Date(r.date+'T12:00:00');return d>=a&&d<=b})}
function totals(rows=periodRecords()){return rows.reduce((a,r)=>({focus:a.focus+r.focusMinutes,scheduled:a.scheduled+r.scheduledMinutes,breaks:a.breaks+r.breaks,breakMinutes:a.breakMinutes+r.breakMinutes,nudges:a.nudges+r.nudges}),{focus:0,scheduled:0,breaks:0,breakMinutes:0,nudges:0})}

function startFocus(courseID=null,automatic=false){if(S.session){go(S.session.mode==='break'?'break':'focus');return}let c=S.courses.find(x=>x.id===courseID)||S.courses.find(x=>x.day===1)||S.courses[0];if(!c){go('timetable');toast('Add a lecture first');return}S.clock=mins(c.start)*60;S.session={courseID:c.id,startClock:S.clock,endClock:mins(c.end)*60,focusSeconds:0,breakSeconds:0,breaks:0,nudges:0,bins:Array(Math.ceil(duration(c)/15)).fill(0),mode:'focus',automatic};S.reviewMood='';S.reviewNote='';S.autoStart=false;go('focus')}
function addFocus(delta,fromClock){let s=S.session;if(!s)return;let remaining=delta,t=fromClock;while(remaining>0){let idx=Math.max(0,Math.floor((t-s.startClock)/900));let segment=Math.min(remaining,900-((t-s.startClock)%900));if(s.bins[idx]!==undefined)s.bins[idx]+=segment/60;t+=segment;remaining-=segment}s.focusSeconds+=delta}

function finishFocus(early=false,completeDemo=false){let session=S.session;if(!session)return;if(completeDemo){let rest=Math.max(0,session.endClock-S.clock);addFocus(rest,S.clock);S.clock=session.endClock}let c=currentCourse();let record={id:'record-'+Date.now(),courseID:c.id,courseName:c.name,teacher:c.teacher,place:c.place,topic:c.topic,date:'2026-10-12',start:c.start,end:c.end,scheduledMinutes:duration(c),focusMinutes:Math.min(duration(c),Math.round(session.focusSeconds/6)/10),breaks:session.breaks,breakMinutes:Math.round(session.breakSeconds/6)/10,nudges:session.nudges,bins:session.bins.map(x=>Math.round(x*10)/10),mood:'',note:'',early};S.records.push(record);S.recordID=record.id;S.session=null;S.reviewMood='';S.reviewNote='';S.history=[];S.page='review';render()}

function tick(){if(window.EntertainmentDemo?.active&&!window.EntertainmentDemo.visible)return;if(!S.setupDone&&S.page!=='today'&&!S.session)return;let delta=1;let from=S.clock;S.clock+=delta;
if(S.autoStart&&!S.session){let next=S.courses.find(c=>c.day===1&&mins(c.start)*60>=from);if(next&&S.clock>=mins(next.start)*60){S.autoStart=false;S.autoEntered=true;S.autoEnterUntil=Date.now()+2000;S.autoCourseID=next.id;S.page='autoentry';render()}}
if(S.page==='autoentry'&&Date.now()>=S.autoEnterUntil)startFocus(S.autoCourseID,true);
let session=S.session;if(session){let used=Math.max(0,Math.min(S.clock,session.endClock)-from);if(session.mode==='focus')addFocus(used,from);else if(session.mode==='break'||session.mode==='restwaiting')session.breakSeconds+=used;if(S.clock>=session.endClock){S.clock=session.endClock;if(window.EntertainmentDemo?.active)window.EntertainmentDemo.close();finishFocus(false);return}if(session.mode==='break'&&S.clock>=session.breakEndClock){session.mode='restwaiting';S.page='breakdone';render();return}if(['focus','break','gentlePause','endconfirm'].includes(S.page))updateTimerUI()}
let status=$('#statusTime');if(status)status.textContent=String(Math.floor(S.clock/3600)%24).padStart(2,'0')+':'+String(Math.floor(S.clock%3600/60)).padStart(2,'0');
if(S.autoStart&&S.page==='today'){let e=$('#autoCountdown');if(e)e.textContent=Math.max(0,10*3600-S.clock)+' sec'}
}

function updateTimerUI(){let s=S.session;if(!s)return;let count=$('#focusCount');if(count)count.textContent=fmt(s.focusSeconds);let rest=$('#breakCount');if(rest)rest.textContent=fmt(Math.max(0,s.breakEndClock-S.clock));let clock=$('.clock');if(clock)clock.style.setProperty('--progress',(S.page==='break'?(1-Math.max(0,s.breakEndClock-S.clock)/(S.settings.breakMinutes*60))*100:s.focusSeconds/((s.endClock-s.startClock)||1)*100)+'%');let left=$('#classRemaining');if(left)left.textContent=Math.ceil((s.endClock-S.clock)/60)+' minutes remaining'}

function setupSchedule(){return '<div class="screen-stack">'+bar(S.user,'Name ready','go("profileSetup")',true)+heading('Let’s capture your timetable')+'<div class="card soft"><h2>Import timetable photo</h2><p class="tiny">Upload a photo of your timetable and review the imported schedule before saving.</p>'+B('Import and Review','chooseTimetable()')+T('Try an example timetable','sampleImport()')+'</div><div class="card soft"><h2>Enter classes manually</h2><p class="tiny">Add each lecture one by one using course, teacher, location, topic, weekday and time.</p>'+B('Add Classes Manually','openCourse(null,"setupSchedule")')+'</div>'+(S.importedConfirmed?'<p class="notice">Your timetable is saved. '+S.courses.length+' lectures are ready.</p>':'')+'<div class="grow"></div>'+B('Next','nextFromSchedule()','primary','next')+'<p class="footer-note">You can skip this and add later from Preferences.</p></div>'}
function calendar(rows,preview=false){let indexed=rows.map((c,index)=>({c,index})).filter(({c})=>c.day>=1&&c.day<=7&&/^([01]\d|2[0-3]):[0-5]\d$/.test(c.start)&&/^([01]\d|2[0-3]):[0-5]\d$/.test(c.end)&&mins(c.end)>mins(c.start)).filter(({c})=>c.repeat!==false||c.date===dateFromDay(S.week*7+c.day-1).toLocaleDateString('en-CA'));rows=indexed.map(x=>x.c);let low=Math.min(9,...rows.map(c=>Math.floor(mins(c.start)/60))),high=Math.min(24,Math.max(20,...rows.map(c=>Math.ceil(mins(c.end)/60))));const count=Math.max(5,...rows.map(c=>c.day)),visibleDays=days.slice(0,count);let out='<div class="calendar-scroll"><div class="calendar" style="grid-template-columns:36px repeat('+count+',minmax(48px,1fr));'+(count>5?'min-width:'+Math.max(420,count*62)+'px;':'')+'"><div class="day">Oct</div>';visibleDays.forEach((d,i)=>{out+='<div class="day '+(i===0?'current':'')+'">'+d.slice(0,3)+'<br>'+dateFromDay(S.week*7+i).getDate()+'</div>'});for(let h=low;h<high;h++){out+='<div class="time">'+h+':00</div>';for(let day=1;day<=count;day++){out+='<div class="cell">';indexed.filter(x=>x.c.day===day&&Math.floor(mins(x.c.start)/60)===h).forEach(({c,index})=>{out+='<button aria-label="Edit '+esc(c.name)+'" class="event color'+(c.color??index%5)+(c.uncertain?' uncertain':'')+'" style="top:'+((mins(c.start)%60)/60*48+1)+'px;height:'+Math.max(22,duration(c)/60*48-2)+'px" onclick="openCourse('+index+','+act(JSON.stringify(preview?'photoReview':'timetable'))+','+preview+')">'+esc(c.name)+(c.section?'\n'+esc(c.section):'')+'</button>'});out+='</div>'}}return out+'</div></div>'}
function calendarHeader(){const rows=S.page==='photoReview'?S.ocrCourses:S.courses,lastDay=Math.max(5,...rows.map(c=>c.day||1));return '<div class="calendar-head"><button aria-label="Previous week" onclick="S.week--;render(true)">'+I('arrow')+'</button><span>'+weekRange(S.week,lastDay)+'</span><button aria-label="Next week" onclick="S.week++;render(true)">'+I('next')+'</button></div>'}
function timetable(){return bar('My timetable','Today','setTab("today")')+heading('Your week, your rhythm.',S.importedConfirmed?'Your saved weekly timetable. Tap a lecture to edit.':'Calendar preview · tap any lecture to edit.')+calendarHeader()+calendar(S.courses)+'<p class="tiny">Repeated lectures follow the selected week. Course times and names can be changed below.</p>'+menu('Add or edit classes','Course, teacher, topic and weekly times','edit','S.previewEdit=false;go("courseList")')+menu('Import timetable photo','Review all detected classes before saving','image','chooseTimetable()')+'<div class="action-stack">'+B('Back to Preferences','setTab("preferences")','secondary','arrow')+'</div>'}
function courseList(){let rows=S.previewEdit?S.ocrCourses:S.courses;return bar(S.previewEdit?'Check imported classes':'Your lectures')+heading('Your class, your rhythm.','Choose a lecture to edit its details.')+rows.map((c,i)=>'<button class="card list-button" onclick="openCourse('+i+','+act(JSON.stringify('courseList'))+','+S.previewEdit+')"><h3>'+esc(c.name)+'</h3><div class="tiny">'+(days[c.day-1]||'Choose weekday')+' · '+c.start+'–'+c.end+' · '+esc(c.place||'Location not set')+'</div></button>').join('')+B('Add lecture','openCourse(null,"courseList",S.previewEdit)','primary','plus')}
function courseForm(){let c=S.draft;if(!c)return '';let out=bar(S.form===null?'Add lecture':'Edit lecture','Cancel','S.page=S.formOrigin;S.history.pop();render()')+heading('Your class, your rhythm.')+field('Course','cname',c.name,'text','S.draft.name=this.value')+field('Teacher','cteacher',c.teacher,'text','S.draft.teacher=this.value')+field('Location','cplace',c.place,'text','S.draft.place=this.value')+field('Topic','ctopic',c.topic||'','text','S.draft.topic=this.value')+field('Section (optional)','csection',c.section||'','text','S.draft.section=this.value')+'<div class="field"><label for="cday">Weekday</label><select id="cday" onchange="S.draft.day=+this.value;S.draft.allowOverlap=false">'+'<option value="0" '+(!c.day?'selected':'')+'>Choose weekday</option>'+days.map((d,i)=>'<option value="'+(i+1)+'" '+(c.day===i+1?'selected':'')+'>'+d+'</option>').join('')+'</select></div><div class="row">'+field('Start time','cstart',c.start,'time','S.draft.start=this.value;S.draft.allowOverlap=false')+field('End time','cend',c.end,'time','S.draft.end=this.value;S.draft.allowOverlap=false')+'</div>'+toggle('Repeat every week','Every '+(days[c.day-1]||'Choose weekday')+' · '+duration(c)+' minutes','S.draft.repeat',!!c.repeat)+(c.recognitionNotes?.length?'<div class="notice"><b>Recognition review</b><ul>'+c.recognitionNotes.map(n=>'<li>'+esc(n)+'</li>').join('')+'</ul></div>':'')+(S.courseError?'<p class="error" role="alert">'+esc(S.courseError)+'</p>':'')+'<div class="action-stack">'+B(c.allowOverlap?'Save overlapping lecture':'Save lecture','saveCourse()','primary','check')+(S.form!==null?B('Remove lecture','deleteCourse()','danger'):'')+'</div>';return out}
function photoReview(){let rows=S.ocrCourses;return bar('Review import','Timetable setup','go(S.ocrOrigin)')+heading('Your week, at a glance.',S.ocrFileName||'Review each detected course and its inferred times before saving.')+'<div id="ocrStatus" class="notice '+(!rows.length&&!S.ocrBusy?'conflict':'')+'" role="status">'+esc(S.ocrStatus||'Choose a timetable photo.')+'</div>'+(S.ocrBusy?B('Stop recognition','cancelRecognition()','secondary'):'')+(S.ocrSummary?'<p class="tiny">'+esc(S.ocrSummary)+'</p>':'')+(S.ocrImage?'<details><summary class="tiny">Original timetable image</summary><img alt="Selected timetable" src="'+S.ocrImage+'" style="display:block;width:100%;max-height:300px;object-fit:contain;margin:10px 0"></details>':'')+(rows.length?calendarHeader()+calendar(rows,true)+'<p class="tiny">Course codes and sections are editable. Start and end boundaries inferred from image position are approximate.</p>'+menu('Edit classes & check times','Keep course codes, sections and weekdays from the import','edit','S.previewEdit=true;go("courseList")')+toggle('Keep existing lectures','Off replaces the current timetable after confirmation.','S.keepExisting',!!S.keepExisting)+B('Confirm & save timetable','confirmImport()','primary','check'):'')+'<div class="action-stack">'+B('Choose another image','chooseTimetable()','secondary','image')+B('Add class manually','S.previewEdit=true;openCourse(null,"photoReview",true)','secondary','plus')+'</div>'}
function today(){let todays=S.courses.filter(c=>c.day===1&&(c.repeat!==false||c.date==='2026-10-12')).sort((a,b)=>mins(a.start)-mins(b.start)),c=todays[0],later=todays.slice(1),session=S.session;let out='<div class="today-head"><button onclick="go(\'profile\')" aria-label="Open my profile">'+avatar(selfID)+'<span>'+esc(S.user)+'</span></button><small>MON, OCT 12</small></div>'+heading('Good Morning!')+'<div class="split-title"><div class="label">Today’s lectures</div>'+T('Edit','S.previewEdit=false;go("timetable")')+'</div>';if(c){let done=S.records.some(r=>!r.demo&&(r.courseID===c.id||(r.courseName===c.name&&r.start===c.start&&r.end===c.end))&&r.date==='2026-10-12');out+='<button class="lecture-card" onclick="startFocus('+act(JSON.stringify(c.id))+')"><div class="time"><span>'+ampm(c.start)+'–'+ampm(c.end)+'</span><span>'+(done?'Recorded':session?.courseID===c.id?'In progress':S.autoEntered?'Starting now':'Up next')+'</span></div><h2>'+esc(c.name)+'</h2><div class="tiny">'+esc(c.teacher)+' · '+esc(c.place)+'</div>'+(c.topic?'<div class="topic">'+I('book')+esc(c.topic)+'</div>':'')+'</button>'}else out+='<div class="empty">'+heading('A little space today.','No lectures are scheduled for Monday.')+B('Add a lecture','openCourse(null,"today")','secondary','plus')+'</div>';out+=later.map(c=>'<button class="lecture-small" onclick="startFocus('+act(JSON.stringify(c.id))+')"><span class="time">'+ampm(c.start).split(' ')[0]+'<small>'+ampm(c.start).split(' ')[1]+'</small></span><span><b>'+esc(c.name)+'</b><span class="tiny" style="display:block">'+esc(c.place)+' · '+duration(c)+' min</span></span></button>').join('')+'<div class="label">Quick access</div><div class="today-quick">'+menu('Friends & study groups',S.friends.length+' friends · requests and group invitations','users','go("friends")')+menu('My timetable','Calendar overview & manual class editor','calendar','S.previewEdit=false;go("timetable")')+'</div><div class="action-stack">';if(session)out+=B('Return to lecture focus','go(S.session.mode==="break"?"break":"focus")','primary','next');else if(S.autoStart)out+='<div class="soft"><b>Starts automatically at 10:00</b><p class="tiny">Timetable-based entry is on for this Demo. No need to press Start.</p><p class="tiny" id="autoCountdown">'+Math.max(0,10*3600-S.clock)+' sec</p></div>';else if(c)out+=B('Start lecture focus','startFocus()','primary','next')+'<p class="footer-note">Start when you settle in. You’re in control.</p>';out+='</div><details class="demo-tools"><summary>Explore the Figma demo states</summary>'+B('09:59 → automatic entry at 10:00','autoDemo()','secondary','clock')+B('View the illustrative reflection week','exampleWeek()','secondary','reflections')+'</details>';return out}
function autoEntry(){return today()+'<div class="card" style="background:var(--navy);color:white"><div class="label" style="color:white;margin-top:0">Classmate · Automatic entry</div><b>Lecture detected from your timetable</b><p class="tiny" style="color:#e5e8ef">Cognitive Psychology is starting. Entering lecture focus — no tap required.</p></div>'}
function clockFace(count,label,caption,progress=0,id='focusCount'){return '<div class="clock" style="--progress:'+progress+'%"><div class="inner"><small>'+label+'</small><b id="'+id+'">'+count+'</b><span>'+esc(caption)+'</span></div></div>'}
function focus(){let s=S.session,c=currentCourse();if(!s||!c)return today();return bar('Lecture focus','•••','S.more=!S.more;render(true)')+'<div class="focus-title"><span class="badge">'+I('sprout')+' Focus is on</span><h1>'+esc(c.name)+'</h1><p class="tiny">'+ampm(c.start)+'–'+ampm(c.end)+' · '+esc(c.place)+'</p>'+(s.automatic?'<p class="tiny" style="color:var(--navy)">Started automatically from your timetable</p>':'')+'</div>'+clockFace(fmt(s.focusSeconds),'TIME IN FOCUS','of your '+duration(c)+'-minute lecture',s.focusSeconds/(duration(c)*60)*100)+'<p class="focus-quote">You don’t have to catch everything.</p><p class="focus-note">Just come back to the next idea.</p><button class="menurow card" onclick="previewReminder()" style="padding:12px">'+I('bell')+'<span class="copy"><b>A gentle nudge, if you drift</b><small>'+(S.settings.notifications?'Entertainment reminders are on.':'Reminders are off.')+'</small></span><span>•</span></button>'+(S.more?'<div class="notice"><p>The timer runs in real time. Session time is not a measure of attention.</p>'+B('Preview an entertainment reminder','previewReminder()','secondary','bell')+B('Complete demonstration lecture','finishFocus(false,true)','secondary','check')+'</div>':'')+'<div class="action-stack">'+B('Take a lecture break','beginBreak()','secondary','cup')+T('End lecture focus','endConfirmation()')+'</div>'}
function breakPage(){let s=S.session,c=currentCourse();if(!s)return today();return bar('Lecture break')+'<div class="focus-title"><span class="badge">'+I('cup')+' Focus is paused</span><h1>Take a breath. You have time.</h1></div>'+clockFace(fmt(Math.max(0,s.breakEndClock-S.clock)),'BREAK REMAINING','of your '+S.settings.breakMinutes+'-minute break',(1-Math.max(0,s.breakEndClock-S.clock)/(S.settings.breakMinutes*60))*100,'breakCount')+'<p class="focus-note">Stretch, sip some water, or look away from your screen for a moment.</p><div class="soft"><b>'+esc(c.name)+'</b><p class="tiny">Break ends · '+ampm(s.breakEndClock)+'</p><p class="tiny">Your lecture ends at '+ampm(c.end)+'.</p></div><div class="action-stack">'+B('Return to lecture early','resumeFocus()','primary','arrow')+T('End lecture focus','endConfirmation()')+'</div>'}
function breakDone(){return bar('A gentle return')+heading('Ready for the next idea?','Your break timer has finished. You can return to class, or keep resting on purpose.')+'<div class="empty">'+avatar(selfID,true)+'</div>'+B('Return to lecture','resumeFocus()','primary','book')+B('Keep resting','keepResting()','secondary','cup')+T('End lecture focus','endConfirmation()')}
function endConfirm(){let s=S.session,c=currentCourse();if(!s)return today();return bar('End lecture focus?')+'<span class="badge">'+I('clock')+' Lecture still in progress</span>'+heading('You can finish here, or stay a little longer.',c.name+' continues until '+ampm(c.end)+'. There are '+Math.ceil((s.endClock-S.clock)/60)+' minutes left.')+'<div class="soft"><div class="label" style="margin-top:0">Your session so far</div><div class="large-number">'+Math.round(s.focusSeconds/60)+' min</div><p class="tiny">present before your intentional break</p><hr style="border:0;border-top:1px solid var(--line)"><p class="tiny">'+s.breaks+' break(s) · '+Math.round(s.breakSeconds/60)+' min</p><p class="tiny">'+Math.floor((S.clock-s.startClock)/60)+' minutes elapsed · Started '+ampm(s.startClock)+'</p></div><div class="card"><b>What happens if you finish?</b><p class="tiny">This focus session ends. You can reflect on the time you spent here; your scheduled lecture stays unchanged.</p></div>'+B('Keep focusing','keepFocusing()','primary','arrow')+B('Finish and reflect','finishFocus(true)','secondary','edit')+'<p class="footer-note">Ending early isn’t a failure. It’s a choice.</p>'}
function gentlePause(){let s=S.session,c=currentCourse();if(!s)return today();return bar('A gentle pause','Classmate','returnFromReminder()')+'<div class="empty"><div class="avatar big">'+I('book')+'</div></div><div class="label">'+esc(S.settings.apps[0]||'Entertainment app')+' · Reminder preview</div>'+heading('Come back to the next idea.','It’s easy to drift. You can return to class now, or choose a short break on purpose.')+'<div class="soft"><b>'+esc(c.name)+'</b><p class="tiny">'+ampm(c.start)+'–'+ampm(c.end)+' · '+esc(c.teacher)+'</p><p class="tiny">'+esc(c.place)+'</p><div class="large-number" id="classRemaining" style="font-size:26px">'+Math.ceil((s.endClock-S.clock)/60)+' minutes remaining</div><p class="tiny">Until '+ampm(c.end)+' · '+esc(c.topic)+'</p></div>'+menu('Reminder settings',S.settings.tone+' · '+(S.settings.sound?'Sound':'Silent')+' · '+S.settings.duringSeconds+'-second check-ins','preferences','go("notifications")')+'<p class="tiny">'+(IS_NATIVE?'App-usage reminders use the Screen Time choices you authorize in Preferences.':'This is an illustrative reminder. Your browser is not monitoring other apps.')+'</p><div class="action-stack">'+B('Return to lecture','returnFromReminder()','primary','book')+B('Take a '+S.settings.breakMinutes+'-minute break','beginBreak()','secondary','cup')+'</div><p class="footer-note">Study tools stay available. Nothing gets blocked.</p>'}
function chart(bins,title='',ratio=''){let max=15;return '<div class="chart-block"><div class="title"><span>'+esc(title)+'</span><span>'+esc(ratio)+'</span></div><div class="chart">'+bins.map(v=>'<div class="chart-col"><div class="chart-bar" style="height:'+Math.min(100,v/max*100)+'%"><span>'+Math.round(v*10)/10+'</span></div></div>').join('')+'</div><div class="chart-labels">'+bins.map((_,i)=>'<span>'+(i*15)+'–'+((i+1)*15)+'</span>').join('')+'</div><p class="micro center">Elapsed lecture time (min) · 15-minute intervals</p></div>'}
function review(){let r=S.records.find(x=>x.id===S.recordID);if(!r)return reflections();return bar('Lecture reflection','Today','setTab("today")')+'<span class="badge">'+I('check')+' '+(r.early?'Session ended early':'Lecture complete')+'</span>'+heading('You made space for learning.')+'<p class="tiny">'+esc(r.courseName)+' · '+ampm(r.start)+'–'+ampm(r.end)+'</p><div class="card soft"><div class="pillrow"><div><div class="large-number">'+r.focusMinutes+' <span style="font-size:18px">min</span></div><div class="tiny">present in a '+r.scheduledMinutes+'-minute lecture</div></div>'+avatar(selfID)+'</div><p class="tiny center">Present minutes · 15-minute intervals</p>'+chart(r.bins,'','')+'<div class="pillrow tiny"><span>'+r.nudges+' gentle returns</span><span>'+r.breaks+' lecture break(s) · '+r.breakMinutes+' min</span></div></div><h2>How present did you feel?</h2><p class="tiny">Not a score. Just a check-in with yourself.</p><div class="feeling">'+[['A bit scattered','cloud'],['Mostly here','sprout'],['Really settled','sun']].map(x=>'<button class="'+(S.reviewMood===x[0]?'selected':'')+'" onclick="S.reviewMood='+act(JSON.stringify(x[0]))+';render(true)">'+I(x[1])+esc(x[0])+'</button>').join('')+'</div><div class="field"><label for="reflectionNote">One idea you’re taking with you <span class="tiny" style="float:right">Optional</span></label><textarea id="reflectionNote" oninput="S.reviewNote=this.value" placeholder="One idea, a question, or a small observation…">'+esc(S.reviewNote)+'</textarea></div>'+B('Save reflection','saveReflection()','primary','check')+T('Skip for now','saveReflection(true)')}
function recordSourceSummary(rows){const samples=rows.filter(r=>r.demo).length,added=rows.length-samples;return samples?(samples+' sample lectures'+(added?' + '+added+' completed in this demo':'')):'Sessions completed in this demo'}
function sampleNotice(rows){return rows.some(r=>r.demo)?'<p class="sample-notice"><span class="demo-badge">DEMO WEEK</span><span>'+esc(recordSourceSummary(rows))+'. Your new sessions update these totals.</span></p>':''}
function reflectionOverview(rows){const t=totals(rows),moods=['A bit scattered','Mostly here','Really settled'];let dates=[...new Set(rows.map(r=>r.date))].sort();const daily=dates.map(date=>({date,focus:rows.filter(r=>r.date===date).reduce((a,r)=>a+r.focusMinutes,0)})),max=Math.max(1,...daily.map(d=>d.focus));return sampleNotice(rows)+'<div class="reflection-stats"><div><b>'+Math.round(t.focus*10)/10+'<small> min</small></b><span>Time in focus</span></div><div><b>'+rows.length+'</b><span>Completed lectures</span></div><div><b>'+pct(t.focus,t.scheduled)+'</b><span>Focused / scheduled</span></div><div><b>'+t.nudges+'</b><span>Gentle returns</span></div></div><div class="reflection-trend"><div class="pillrow"><b>Focus through the week</b><small>minutes</small></div><div class="daily-bars" role="img" aria-label="'+esc(daily.map(d=>d.date+': '+d.focus+' minutes').join('; '))+'">'+daily.map(d=>'<div><span>'+Math.round(d.focus*10)/10+'</span><i style="height:'+Math.max(3,d.focus/max*62)+'px"></i><small>'+new Intl.DateTimeFormat('en-US',{weekday:'short'}).format(new Date(d.date+'T12:00:00'))+'</small></div>').join('')+'</div><p>'+t.breaks+' intentional breaks · '+Math.round(t.breakMinutes*10)/10+' min resting</p></div><div class="mood-overview"><span>How it felt</span><div>'+moods.map(m=>'<small>'+m+' <b>'+rows.filter(r=>r.mood===m).length+'</b></small>').join('')+'</div></div>'}
function reflections(){let rows=[...S.records].sort((a,b)=>b.date.localeCompare(a.date)||Number(!!a.demo)-Number(!!b.demo)||b.id.localeCompare(a.id));return bar('Reflections','','',false)+heading('What you’re noticing.','Small observations from your time in class.')+(rows.length?reflectionOverview(rows)+B('Explore focus insights','S.rankWeek=0;go("insights")','secondary','reflections')+'<div class="label">Lecture history · '+rows.length+'</div>'+rows.map(r=>'<button class="card list-button reflection-record" onclick="openRecord('+act(JSON.stringify(r.id))+')"><div class="label" style="margin-top:0">'+esc(fullDate(new Date(r.date+'T12:00:00'))) +' · '+ampm(r.start)+(r.demo?' <span class="record-demo-label">Sample</span>':' <span class="record-demo-label new">New session</span>')+'</div><div class="pillrow"><b>'+esc(r.courseName)+'</b>'+I('chevron','chevron')+'</div><p class="tiny">'+r.focusMinutes+' of '+r.scheduledMinutes+' min present · '+esc(r.mood||'Not yet reflected')+'</p><p class="tiny" style="margin-top:12px">'+esc(r.note?r.note.slice(0,90)+(r.note.length>90?'…':''):'A little space to leave an observation.')+'</p></button>').join(''):'<div class="empty">'+avatar(selfID,true)+heading('A fresh page.','Your recorded lectures and reflections will appear here after your first session.')+B('Go to Today','setTab("today")','primary','next')+T('Explore the illustrative Figma week','exampleWeek()')+'</div>')}
function insights(){let rows=periodRecords(),t=totals(rows);return bar('Focus insights','Reflections','setTab("reflections")')+heading('Patterns, not perfect scores.',rankRange()+' · Weekly overview')+sampleNotice(rows)+'<div class="card soft"><div class="label" style="margin-top:0">Time you made space for</div><div class="large-number">'+Math.round(t.focus*10)/10+' min</div><p class="tiny">present across '+rows.length+' lectures · '+t.scheduled+' min scheduled</p><p class="tiny">'+t.nudges+' gentle returns · '+t.breaks+' breaks totalling '+Math.round(t.breakMinutes*10)/10+' min</p></div><div class="label">Present minutes · 15-minute intervals</div>'+(rows.length?rows.map(r=>chart(r.bins,esc(fullDate(new Date(r.date+'T12:00:00')))+' · '+r.courseName,r.focusMinutes+' / '+r.scheduledMinutes)).join(''):'<div class="empty"><p class="muted">Complete a lecture to see a pattern begin.</p>'+T('Load the illustrative week','exampleWeek()')+'</div>')+'<div class="card"><b>An anchor worth keeping</b><p class="tiny">'+esc(rows.find(r=>r.note)?.note||'Keep a question or a small observation after class. It can be something to return to next time.')+'</p></div><p class="tiny">These records describe time, not your worth. Breaks count separately from present time.</p>'}
function preferences(){return bar('Preferences','Profile','go("profile")')+heading('Support, on your terms.','Keep what helps. Change what doesn’t.')+menu('My profile','Edit name & icon · '+selfID,'users','go("profile")')+menu('Friends & study groups',S.friends.length+' friends · requests and group invitations','users','go("friends")')+'<div class="label">Your focus plan</div>'+menu('My timetable','Add, edit and remove classes manually','calendar','S.previewEdit=false;go("timetable")')+menu('Customize notifications',S.settings.tone+' tone · '+(S.settings.sound?'Sound':'Silent')+' · Custom message','bell','go("notifications")')+menu('Reminder timing','Before class · '+S.settings.duringSeconds+'-second check-ins · Lecture breaks','clock','go("reminders")')+menu('Entertainment apps',S.settings.apps.slice(0,3).join(', ')+' · '+S.settings.apps.length+' selected','phone','go("apps")')+(IS_NATIVE?menu('App usage reminders',S.nativeMonitoring.enabled?'Screen Time monitoring is on':'Choose apps with iOS Screen Time','clock','native("monitorSettings",{settings:S.settings})'):'')+'<div class="label">About Classmate</div>'+menu('Privacy & help','Your choices and practical questions','help','go("help")')+'<p class="tiny" style="margin-top:26px">Study tools stay available. Nothing gets blocked.</p><details class="demo-tools"><summary>Demo scenarios & restart</summary>'+B('Automatic timetable entry at 10:00','autoDemo()','secondary','clock')+B('Load the Figma reflection week','exampleWeek()','secondary','reflections')+B('Try the Mia friend-request scenario','friendScenario()','secondary','users')+B('Show ranking empty state','S.rankWeek=1;setTab("ranking")','secondary','ranking')+B('View opening logo screen','go("splash")','secondary')+B('Restart this demo','reset()','secondary')+'</details>'}
function notificationPreview(){return '<div class="card soft"><div class="label" style="margin-top:0">Reminder preview</div><div class="person" style="margin:10px 0">'+I('bell')+'<span>Classmate</span><span class="tiny" style="margin-left:auto">now</span></div><b>'+esc(S.settings.message)+'</b><p class="tiny">Cognitive Psychology · '+S.settings.tone+' · '+(S.settings.sound?'Sound':'Silent')+'</p></div>'}
function chooseTone(tone){S.settings.tone=tone;S.settings.message=tone==='Gentle'?'Want to come back to the next idea?':'Return to your lecture.';render(true)}
function notifications(){return bar('Customize notifications','Preferences','setTab("preferences")')+heading('A reminder that feels like you.','Choose how Classmate checks in. Keep what helps.')+toggle('Enable notifications','You can turn reminders off at any time.','S.settings.notifications',S.settings.notifications)+'<div class="label">Wording</div>'+chipOptions([{label:'Gentle',value:'Gentle'},{label:'Simple',value:'Simple'}],S.settings.tone,'chooseTone($VALUE)')+'<p class="tiny">Quiet wording, no judgement.</p>'+field('Your reminder message','notificationMessage',S.settings.message,'text','S.settings.message=this.value')+T('Use the default message','chooseTone(S.settings.tone)')+notificationPreview()+'<div class="label">Sound & feel</div>'+chipOptions([{label:'Silent',value:false},{label:'Sound',value:true}],S.settings.sound,'S.settings.sound=$VALUE;render(true)')+toggle('Vibration','Off for a quiet nudge.','S.settings.vibration',S.settings.vibration)+'<p class="tiny">These are preferences in Classmate. Your phone’s settings determine how notifications look, sound and arrive.</p>'+B('Save notifications','if(!S.settings.message.trim()){toast("Enter a reminder message");return}syncNative();native("requestNotifications",{enabled:S.settings.notifications});setTab("preferences");toast("Notification preferences saved")','primary','check')}
function reminders(){return bar('Reminder timing','Preferences','setTab("preferences")')+heading('A little nudge, when it helps.','Set a rhythm that leaves room to learn.')+'<div class="label">Scheduled reminders</div>'+toggle('Before class','A moment to get ready.','S.settings.before',S.settings.before)+'<div class="field"><label for="beforeMinutes">Remind me before class</label><select id="beforeMinutes" onchange="S.settings.beforeMinutes=+this.value">'+[1,5,10,15,30].map(v=>'<option value="'+v+'" '+(S.settings.beforeMinutes===v?'selected':'')+'>'+v+' minutes</option>').join('')+'</select></div>'+toggle('During lecture','Nudge me when I open entertainment apps.','S.settings.during',S.settings.during)+chipOptions([{label:'15 sec',value:15},{label:'30 sec (Default)',value:30},{label:'1 min',value:60},{label:'Custom',value:0}],[15,30,60].includes(S.settings.duringSeconds)?S.settings.duringSeconds:0,'S.settings.duringSeconds=$VALUE||S.settings.duringCustom;render(true)')+field('Custom interval (seconds)','customDuring',S.settings.duringCustom,'number','S.settings.duringCustom=+this.value;if(![15,30,60].includes(S.settings.duringSeconds))S.settings.duringSeconds=+this.value')+'<p class="tiny">Not a restriction. Just a chance to notice the autopilot.</p>'+toggle('When a break finishes','A gentle invitation to return, if class is still on.','S.settings.breakReminder',S.settings.breakReminder)+chipOptions([{label:'3 mins',value:3},{label:'5 mins (Default)',value:5},{label:'10 min',value:10},{label:'Custom',value:0}],[3,5,10].includes(S.settings.breakMinutes)?S.settings.breakMinutes:0,'S.settings.breakMinutes=$VALUE||S.settings.breakCustom;render(true)')+field('Custom interval (minutes)','customBreak',S.settings.breakCustom,'number','S.settings.breakCustom=+this.value;if(![3,5,10].includes(S.settings.breakMinutes))S.settings.breakMinutes=+this.value')+'<p class="tiny">This is just a nudge, you can always choose to keep resting.</p><div class="action-stack">'+B('Save timing','saveTiming()','primary','check')+T('Back to notifications','go("notifications")')+'</div>'}
function saveTiming(){if(!Number.isFinite(S.settings.duringSeconds)||S.settings.duringSeconds<5||S.settings.duringSeconds>3600){toast('Choose a check-in interval from 5 to 3600 seconds');return}if(!Number.isFinite(S.settings.breakMinutes)||S.settings.breakMinutes<1||S.settings.breakMinutes>60){toast('Choose a break from 1 to 60 minutes');return}syncNative();setTab('preferences');toast('Reminder timing saved')}
function appsView(){return bar('Entertainment apps')+appChoices()+B('Confirm '+S.settings.apps.length+' apps','syncNative();setTab("preferences");toast("Entertainment app choices saved")','primary','check')+'<p class="footer-note">You can change this list any time.</p>'}
function profile(){let t=totals();return bar('My profile','Today','setTab("today")')+heading('Your little corner.')+personRow(selfID,selfID+' · Your permanent user ID',T('Copy','copyText(selfID)'))+B('Edit name & icon','S.profileDraft=S.user;go("profileEdit")','secondary','edit')+menu('Friends & study groups',S.friends.length+' friends · requests and group invitations','users','go("friends")')+menu('My QR code','Let a friend find your profile','qr','go("myqr")')+menu('My timetable','Calendar preview & manual class editor','calendar','go("timetable")')+'<button class="card soft list-button" onclick="setTab(\'ranking\')"><div class="label" style="margin-top:0">This week · '+rankRange()+'</div><div class="large-number">'+pct(t.focus,t.scheduled)+'</div><p class="tiny">'+Math.round(t.focus*10)/10+' focused / '+t.scheduled+' scheduled min</p><p class="tiny">View ranking →</p></button><p class="tiny">Find this profile any time from your avatar on Today.</p>'}
function profileEdit(){return bar('Edit profile','Cancel','go("profile")')+heading('Still you, a little updated.','Change how friends see you. Your ID stays with you.')+avatar(selfID,true)+'<p class="tiny center">Current icon · '+esc(S.avatar)+'</p><div class="center">'+T('Change simple icon','openAvatar("profileEdit")')+'<br>'+T('Choose from gallery','S.profileOrigin="profileEdit";S.pendingPhoto="";go("gallery")')+'</div>'+field('Display name','profileName',S.profileDraft||S.user,'text','S.profileDraft=this.value')+'<p class="tiny">Your name can change. Friends find the same profile using your ID.</p><div class="field"><label>User ID · cannot be edited</label><input readonly value="'+selfID+'"></div><div class="notice">Changing your name or avatar won’t change your friends, groups or recorded lecture history.</div>'+B('Save changes','if(!S.profileDraft.trim()){toast("Enter your display name");return}S.user=S.profileDraft.trim();go("profile");toast("Profile saved")','primary','check')}
function avatarView(){return bar('Choose an icon','Today','setTab("today")')+heading('A small mark of you.','Pick a simple icon. No photo needed.')+'<div class="avatar big">'+I(S.avatarDraft)+'</div><p class="center tiny" style="color:var(--navy)">Choose an icon for your Today profile</p><div class="icon-grid">'+iconNames.map(n=>'<button class="'+(S.avatarDraft===n.toLowerCase()?'selected':'')+'" onclick="S.avatarDraft='+act(JSON.stringify(n.toLowerCase()))+';render(true)">'+I(n.toLowerCase())+'<span>'+n+'</span></button>').join('')+'</div>'+B('Save selection','saveAvatar()','primary','check')+B('Choose from gallery','S.pendingPhoto="";go("gallery")','secondary','image')}
function gallery(){return bar('Profile photo','Cancel','back()')+heading('Choose your frame.','A preview of selecting a profile photo from your phone.')+'<div class="card"><div class="photo-preview">'+(S.pendingPhoto?'<img alt="Selected profile image" src="'+S.pendingPhoto+'">':'<div class="avatar big">'+I(S.galleryChoice)+'</div>')+'</div><p class="tiny center">Profile crop preview</p></div><div class="label">Gallery picker · concept preview</div><div class="icon-grid">'+['user','mountain','bloom','book','tree','sun'].map(n=>'<button class="'+(!S.pendingPhoto&&S.galleryChoice===n?'selected':'')+'" onclick="S.pendingPhoto=\'\';S.galleryChoice='+act(JSON.stringify(n))+';render(true)">'+I(n)+'</button>').join('')+'</div>'+B('Choose a photo from device','chooseProfilePhoto()','secondary','image')+'<p class="tiny">The tiles are illustrative. You choose which photo to share with this app.</p>'+B('Confirm selected photo','confirmProfilePhoto()','primary','check')}
function chooseProfilePhoto(){if(native('avatarPhoto'))return;$('#avatarFile').click()}
function confirmProfilePhoto(){if(S.pendingPhoto){S.avatarPhoto=S.pendingPhoto;S.pendingPhoto=''}else{S.avatar=S.galleryChoice;S.avatarPhoto=''}S.page=S.profileOrigin||'profile';S.history=[];render();toast('Profile photo saved')}
function friends(){return bar('Friends & groups','Profile','go("profile")')+heading('Good company, gently.','Connect first. Choose a study group together.')+S.incoming.map(id=>'<div class="card"><div class="label" style="margin-top:0">Incoming request · '+S.incoming.length+'</div>'+personRow(id)+'<p class="tiny">'+esc(person(id).name.split(' ')[0])+' would like to be your friend.</p><div class="row">'+B('Accept','acceptIncoming('+JSON.stringify(id)+')')+B('Decline','declineIncoming('+JSON.stringify(id)+')','secondary')+'</div></div>').join('')+'<div class="label">Your friends · '+S.friends.length+'</div>'+S.friends.map(id=>'<button class="plain" style="display:block;width:100%;text-align:left" onclick="S.friendTarget='+act(JSON.stringify(id))+';go(\'friendPreview\')">'+personRow(id)+'</button>').join('')+(S.friends.length?'':'<p class="tiny">No friends yet. Add a friend by their permanent ID.</p>')+(S.outgoing.length?'<div class="label">Requests sent · pending</div>'+S.outgoing.map(id=>'<button class="plain" style="display:block;width:100%;text-align:left" onclick="S.friendTarget='+act(JSON.stringify(id))+';go(\'friendPending\')">'+personRow(id,'Waiting for acceptance')+'</button>').join(''):'')+menu('Study groups','Invite accepted friends · '+S.groups.length+' groups','users','go("groups")')+menu('My QR','Share your profile preview','qr','go("myqr")')+'<div class="action-stack">'+B('Add friend by ID','S.friendError="";go("friendAdd")','primary','users')+'</div>'}
function friendAdd(notFound=false){return bar('Add a friend','Friends','go("friends")')+heading(notFound?'Let’s check that ID.':'Find a familiar face.',notFound?S.friendError:'Ask your friend for their Classmate user ID.')+field(notFound?'Friend’s user ID · edit to retry':'Friend’s user ID','friendID',S.friendID,'text','S.friendID=this.value')+'<p class="tiny">'+(notFound?'Ask your friend to copy their ID from their profile. Check each letter and number, including the NT- prefix.':'Use their permanent ID, not their display name. Names can be shared by more than one person.')+'</p><div class="soft"><div class="label" style="margin-top:0">'+(notFound?'Another way to find them':'A little check before connecting')+'</div><p class="tiny">'+(notFound?'Try their friend QR instead. You’ll still verify their profile before sending a request.':'You’ll see a profile first. Check the name and icon, then choose whether to send a request.')+'</p></div>'+menu('Where’s my ID?','Your profile · below your display name','help','go("profile")')+'<div class="action-stack">'+B(notFound?'Try this ID again':'Find profile','lookupFriend()','primary','search')+B('Scan QR instead','go("scan")','secondary','scan')+'</div>'}
function friendPreview(){let id=S.friendTarget,p=person(id),connected=S.friends.includes(id),pending=S.outgoing.includes(id);return bar('Profile found','Search','go("friendAdd")')+heading('Is this your friend?','Take a moment to check before you connect.')+'<div class="card center">'+avatar(id,true)+'<h2>'+esc(p.name)+'</h2><p style="color:var(--navy)">'+esc(id)+'</p><p class="tiny">Permanent user ID · exact match</p></div><div class="soft"><div class="label" style="margin-top:0">'+(connected?'You’re friends':pending?'Request is pending':'You’re not friends yet')+'</div><p class="tiny">'+(connected?'You can choose to invite this friend to a study group.':pending?'Your friend can choose whether to connect.':'A request lets '+esc(p.name.split(' ')[0])+' choose whether to connect. You’ll become friends only after they accept.')+'</p></div><p class="tiny">A QR scan leads to this same identity check before a request is sent.</p><div class="action-stack">'+(connected?B('View study groups','go("groups")','primary','users'):pending?B('View pending request','go("friendPending")','primary','send'):B('Send friend request','sendRequest()','primary','users'))+B('Not the right person? Search again','go("friendAdd")','secondary')+'</div>'}
function friendPending(){let p=person(S.friendTarget);return bar('Friend request','Friends','go("friends")')+'<div class="empty"><div class="avatar big">'+I('send')+'</div></div>'+heading('A hello is on its way.','Your friend request has been sent to '+p.name+'.')+'<div class="card"><div class="label" style="margin-top:0">Pending · Waiting for '+esc(p.name.split(' ')[0])+'</div>'+personRow(p.id)+'<p class="tiny">You’re not friends yet. '+esc(p.name.split(' ')[0])+' needs to accept your request before they appear in your friends list.</p></div><p class="tiny">Once accepted, you can invite them to a study group. A friend request doesn’t create a group.</p><div class="action-stack">'+B('Back to friends','go("friends")','primary','arrow')+T('Preview acceptance (Demo)','acceptOutgoing()')+'</div>'}
function scan(){return bar('Scan friend QR','Friends','go("friends")')+heading('A quick way to say hello.','Place your friend’s Classmate QR inside the frame.')+'<div class="scan-box"><div class="scan-frame">'+I('scan')+'</div><span class="micro">CAMERA PREVIEW · NOT ACTIVE</span></div><p class="tiny">This demo uses a sample scan. It doesn’t use your camera.</p><div class="card"><div class="label" style="margin-top:0">Scan → Verify → Request</div><p class="tiny">A scan opens the matching profile, not an automatic friendship. Check their name and ID before sending a request.</p></div>'+B('Try sample QR scan','S.friendTarget="NT-4P8R2H";go("friendPreview")','primary','camera')+B('Enter user ID instead','go("friendAdd")','secondary')}
function qrPattern(){let rects='';function dot(x,y){rects+='<rect x="'+x+'" y="'+y+'" width="1" height="1"/>'}for(let y=0;y<29;y++)for(let x=0;x<29;x++){let find=(x<9&&y<9)||(x>19&&y<9)||(x<9&&y>19);if(!find&&((x*7+y*11+x*y)%5<2))dot(x,y)}[[1,1],[21,1],[1,21]].forEach(([x,y])=>{rects+='<path fill-rule="evenodd" d="M'+x+' '+y+'h7v7h-7zM'+(x+1)+' '+(y+1)+'h5v5h-5z"/><rect x="'+(x+2)+'" y="'+(y+2)+'" width="3" height="3"/>'});return '<svg class="qr" viewBox="0 0 29 29" role="img" aria-label="Illustrative QR preview, not scannable">'+rects+'</svg>'}
function myqr(){return bar('My QR code','Profile','go("profile")')+heading('An invitation to connect.','Your friends can check your profile before sending a request.')+'<div class="card center">'+avatar(selfID)+'<h2>'+esc(S.user)+'</h2><p style="color:var(--navy)">'+selfID+'</p>'+qrPattern()+'<div class="micro" style="color:var(--navy)">PREVIEW / ILLUSTRATIVE · NOT SCANNABLE</div></div><p class="tiny">Your permanent user ID stays the same even if you change your name or icon.</p>'+B('Share QR preview','shareProfile()','primary','share')+B('Copy user ID','copyText(selfID)','secondary','copy')}
function groups(){return bar('Study groups','Friends','go("friends")')+heading('Make room together.','Small circles for sharing a little lecture focus.')+S.groups.map((g,i)=>'<div class="card '+(i===0?'soft':'')+'"><div class="label" style="margin-top:0">'+(i===0?'Your group · invitations in progress':'Your circle')+'</div><h2>'+esc(g.name)+'</h2><p class="tiny">'+g.members.length+' members · '+g.pending.length+' pending invitation(s)</p>'+menu('Open '+g.name,'See members and invite status','users','openGroup('+JSON.stringify(g.id)+')')+menu('Group ranking','Accepted members only','ranking','openGroupRank('+JSON.stringify(g.id)+')')+'</div>').join('')+'<p class="tiny">Invite friends who have already accepted your friend request. They still choose whether to join each group.</p><p class="tiny">Adding a friend never creates a group automatically.</p>'+B('Create study group','openGroupForm()','primary','plus')}
function groupForm(){return bar('Create study group','Cancel','go("groups")')+heading('Start a small circle.','Choose the friends you’d like to study alongside.')+field('Group name','groupName',S.groupDraftName,'text','S.groupDraftName=this.value')+'<div class="card soft">'+personRow(selfID,'You · included as group owner','<span class="tiny">Included</span>')+'</div><div class="label">Invite accepted friends · '+S.groupDraftMembers.length+' selected</div>'+S.friends.map(id=>'<button class="plain" style="display:block;width:100%;text-align:left" onclick="toggleGroupFriend('+act(JSON.stringify(id))+')">'+personRow(id,person(id).id,'<span class="check" style="'+(S.groupDraftMembers.includes(id)?'color:var(--navy);border-color:var(--navy)':'')+'">'+(S.groupDraftMembers.includes(id)?'✓':'')+'</span>')+'</button>').join('')+(S.friends.length?'':'<p class="tiny">Connect with a friend first, then invite them from your group page.</p>')+'<div class="card"><p class="tiny">Being friends doesn’t make someone a group member. Invitees receive a separate invitation to accept.</p></div>'+(S.groupError?'<p class="error">'+esc(S.groupError)+'</p>':'')+B('Create group & send invitations','createGroup()','primary','users')+'<p class="footer-note">You join now. Invitees join only after accepting.</p>'}
function groupDetail(){let g=selectedGroup();if(!g)return groups();return bar(g.name,'Groups','go("groups")')+heading(g.name,'A little encouragement, one lecture at a time.')+'<div class="card soft"><b>'+g.members.length+' members · '+g.pending.length+' invitation(s) pending</b><p class="tiny">You manage this group. Members choose when to join.</p></div><div class="label">Accepted members</div>'+g.members.map(id=>personRow(id,person(id).id+' · '+(id===selfID?'You, owner':'Joined'))).join('')+(g.pending.length?'<div class="card"><div class="label" style="margin-top:0">Invitation pending</div>'+g.pending.map(id=>personRow(id,person(id).id,'<span class="tiny" style="color:var(--navy)">Pending</span>')+'<p class="tiny">'+esc(person(id).name.split(' ')[0])+' hasn’t joined yet and isn’t in this group’s standings.</p>').join('')+'</div>':'<p class="tiny">No invitations are waiting.</p>')+menu('Group ranking','Compare accepted members’ completed lectures','ranking','openGroupRank('+JSON.stringify(g.id)+')')+menu('Manage group','Name, members & invitations','preferences','go("groupManage")')+'<div class="action-stack">'+B('Invite friends','go("groupInvite")','primary','users')+'</div>'}
function groupInvite(){let g=selectedGroup(),eligible=S.friends.filter(id=>!g.members.includes(id)&&!g.pending.includes(id));return bar('Invite friends','Groups','go("groupdetail")')+heading('Choose your company.','Only accepted friends can be invited. They choose whether to join this group.')+eligible.map(id=>'<div class="card">'+personRow(id)+B('Send group invitation','inviteToGroup('+JSON.stringify(id)+')','secondary','send')+'</div>').join('')+(eligible.length?'':'<div class="empty"><p class="muted">Every accepted friend is already a member or has an invitation pending.</p>'+B('Add another friend','go("friendAdd")','secondary','users')+'</div>')}
function groupManage(){let g=selectedGroup();return bar('Manage group','Group','go("groupdetail")')+heading('Your circle, with care.')+field('Group name','groupRename',g.name)+B('Save group name','renameGroup()','secondary','check')+'<div class="label">Accepted members</div>'+g.members.map(id=>'<div>'+personRow(id,person(id).id,id!==selfID?T('Remove','removeGroupMember('+JSON.stringify(id)+')'):'<span class="tiny">Owner</span>')+'</div>').join('')+'<div class="label">Pending invitations</div>'+g.pending.map(id=>'<div class="card">'+personRow(id,'Pending')+B('Preview their acceptance (Demo)','acceptGroup('+JSON.stringify(id)+')','secondary','check')+T('Cancel invitation','cancelGroupInvite('+JSON.stringify(id)+')')+'</div>').join('')+B('Invite accepted friends','go("groupInvite")','primary','users')}
function rankingTabs(){return '<div class="tabs"><button class="'+(S.rankTab==='groups'?'selected':'')+'" onclick="S.rankTab=\'groups\';render()">My groups</button><button class="'+(S.rankTab==='global'?'selected':'')+'" onclick="S.rankTab=\'global\';render()">Global</button></div>'}

function cleanRecognizedCourse(row,index){const name=String(row.name||'').replace(/\s+/g,' ').trim();if(!name||/^(LA|L|T|LEC|LAB|TUT|SEM)\s*[0-9OIl]+$/i.test(name))return null;let code=TimetableCore.codeOf(name),section=row.section||'';if(!section){let m=name.match(/\b(LA|L|T|LEC|LAB|TUT|SEM)\s*([0-9OIl]{1,4})\b/i);if(m)section=m[1].toUpperCase()+m[2].replace(/[Oo]/g,'0').replace(/[Il]/g,'1')}return {...row,id:row.id||'import-'+Date.now()+'-'+index,name:code?.name||name,section,topic:row.topic||'',teacher:row.teacher||'',place:row.place||'',repeat:row.repeat!==false,color:index%5,uncertain:row.uncertain!==false,recognitionNotes:row.recognitionNotes||[]}}
function chooseTimetable(){if(S.page!=='photoReview')S.ocrOrigin=S.page==='setupSchedule'?'setupSchedule':'timetable';if(native('importTimetable')){S.ocrBusy=true;S.ocrCourses=[];S.ocrStatus='Choose a timetable photo. Recognition runs on this device.';go('photoReview');return}$('#timetableFile').click()}
async function handleTimetableImage(event){let file=event.target.files?.[0];if(!file)return;if(currentRecognitionWorker){currentRecognitionWorker.terminate().catch(()=>{});currentRecognitionWorker=null}let generation=++ocrGeneration;S.ocrFileName=file.name;if(S.ocrImage?.startsWith('blob:'))URL.revokeObjectURL(S.ocrImage);S.ocrImage=URL.createObjectURL(file);S.ocrCourses=[];S.ocrSummary='';S.ocrBusy=true;S.ocrStatus='Preparing timetable recognition…';go('photoReview');let worker;const progress=message=>{if(generation!==ocrGeneration)return;S.ocrStatus=message;let el=$('#ocrStatus');if(el)el.textContent=message};try{await ocrTimeout(loadRecognition());if(generation!==ocrGeneration)return;worker=await ocrTimeout(Tesseract.createWorker('eng+chi_tra').then(w=>{if(generation!==ocrGeneration||!S.ocrBusy){w.terminate();throw Error('Recognition stopped')}return w}),60000);currentRecognitionWorker=worker;let rows=await ocrTimeout(recognizeTimetableImage(file,worker,progress,()=>generation!==ocrGeneration),180000);rows=rows.map(cleanRecognizedCourse).filter(Boolean);if(generation!==ocrGeneration)return;S.ocrCourses=rows;const incomplete=rows.filter(c=>!c.day||!c.start||!c.end).length;S.ocrStatus=rows.length?'Found '+rows.length+' possible classes. '+(incomplete?incomplete+' need a weekday or time before saving. ':'')+'Review course codes, sections and inferred times.':'No readable course blocks could be matched. Keep the weekday headings and time labels in the screenshot, or add the classes manually.'}catch(error){if(generation===ocrGeneration)S.ocrStatus=error.message||'This image could not be recognized. Try another image or add classes manually.'}finally{if(worker){await worker.terminate().catch(()=>{});if(currentRecognitionWorker===worker)currentRecognitionWorker=null}if(generation===ocrGeneration){S.ocrBusy=false;render(true)}event.target.value=''}}
function sampleImport(){S.ocrOrigin=S.page==='setupSchedule'?'setupSchedule':'timetable';S.ocrImage='';S.ocrFileName='Illustrative imported timetable · 12 course blocks';let specs=[['ISOM 2700','L3',2,'09:00','10:20'],['ISOM 2700','L3',4,'09:00','10:20'],['FINA 2303','L6',1,'10:30','11:50'],['FINA 2303','L6',3,'10:30','11:50'],['ISOM 2010','L03',2,'13:30','14:50'],['ISOM 2010','L03',4,'13:30','14:50'],['ISOM 2010','LA01',1,'15:00','15:50'],['ISOM 2020','L09',3,'14:00','15:50'],['PHYS 1101','L2',2,'15:30','17:20'],['PHYS 1101','L2',4,'15:30','17:20'],['ISOM 2020','LA06',3,'16:30','18:20'],['PHYS 1101','T3',4,'18:00','18:50']];S.ocrCourses=specs.map((x,i)=>({id:'sample-import-'+i,name:x[0],section:x[1],day:x[2],start:x[3],end:x[4],teacher:'',place:'',topic:'',repeat:true,color:i%5,uncertain:true}));S.ocrStatus='12 course blocks · check times. This sample demonstrates the review flow; exact boundaries need checking.';S.ocrBusy=false;go('photoReview')}
function confirmImport(){if(S.session){toast('Finish your current lecture before importing a new timetable.');return}let rows=S.ocrCourses;if(!rows.length){toast('Add or detect at least one lecture first');return}let invalid=rows.find(c=>!c.name?.trim()||!Number.isInteger(c.day)||c.day<1||c.day>7||!/^([01]\d|2[0-3]):[0-5]\d$/.test(c.start)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(c.end)||mins(c.end)<=mins(c.start));if(invalid){toast('Check every course name, weekday and time before saving');S.previewEdit=true;go('courseList');return}let cleaned=rows.map(c=>({...c,uncertain:false,repeat:c.repeat!==false}));S.courses=S.keepExisting?[...S.courses,...cleaned.filter(c=>!S.courses.some(x=>x.name===c.name&&x.day===c.day&&x.start===c.start&&x.end===c.end))]:cleaned;S.importedConfirmed=true;S.previewEdit=false;S.ocrCourses=[];S.page=S.ocrOrigin==='setupSchedule'?'setupSchedule':'timetable';S.history=[];render();syncNative();toast('Timetable confirmed and saved')}
document.getElementById('timetableFile').addEventListener('change',handleTimetableImage);
document.getElementById('avatarFile').addEventListener('change',event=>{let file=event.target.files?.[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{S.pendingPhoto=String(reader.result);render(true)};reader.readAsDataURL(file);event.target.value=''});
render();syncNative();
