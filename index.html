function review(){let r=S.records.find(x=>x.id===S.recordID);if(!r)return reflections();return bar('Lecture reflection','Today','setTab("today")')+'<span class="badge">'+I('check')+' '+(r.early?'Session ended early':'Lecture complete')+'</span>'+heading('You made space for learning.')+'<p class="tiny">'+esc(r.courseName)+' · '+ampm(r.start)+'–'+ampm(r.end)+'</p><div class="card soft"><div class="pillrow"><div><div class="large-number">'+r.focusMinutes+' <span style="font-size:18px">min</span></div><div class="tiny">present in a '+r.scheduledMinutes+'-minute lecture</div></div>'+avatar(selfID)+'</div><p class="tiny center">Present minutes · 15-minute intervals</p>'+chart(r.bins,'','')+'<div class="pillrow tiny"><span>'+r.nudges+' gentle returns</span><span>'+r.breaks+' lecture break(s) · '+r.breakMinutes+' min</span></div></div><h2>How present did you feel?</h2><p class="tiny">Not a score. Just a check-in with yourself.</p><div class="feeling">'+[['A bit scattered','cloud'],['Mostly here','sprout'],['Really settled','sun']].map(x=>'<button class="'+(S.reviewMood===x[0]?'selected':'')+'" onclick="S.reviewMood='+act(JSON.stringify(x[0]))+';render(true)">'+I(x[1])+esc(x[0])+'</button>').join('')+'</div><div class="field"><label for="reflectionNote">One idea you’re taking with you <span class="tiny" style="float:right">Optional</span></label><textarea id="reflectionNote" oninput="S.reviewNote=this.value" placeholder="One idea, a question, or a small observation…">'+esc(S.reviewNote)+'</textarea></div>'+B('Save reflection','saveReflection()','primary','check')+T('Skip for now','saveReflection(true)')}

function insights(){let rows=periodRecords(),t=totals(rows);return bar('Focus insights','Reflections','setTab("reflections")')+heading('Patterns, not perfect scores.',rankRange()+' · Weekly overview')+'<div class="card soft"><div class="label" style="margin-top:0">Time you made space for</div><div class="large-number">'+Math.round(t.focus*10)/10+' min</div><p class="tiny">present across '+rows.length+' lectures · '+t.scheduled+' min scheduled</p><p class="tiny">'+t.nudges+' gentle returns · '+t.breaks+' breaks totalling '+Math.round(t.breakMinutes*10)/10+' min</p></div><div class="label">Present minutes · 15-minute intervals</div>'+(rows.length?rows.map(r=>chart(r.bins,esc(fullDate(new Date(r.date+'T12:00:00')))+' · '+r.courseName,r.focusMinutes+' / '+r.scheduledMinutes)).join(''):'<div class="empty"><p class="muted">Complete a lecture to see a pattern begin.</p>'+T('Load the illustrative week','exampleWeek()')+'</div>')+'<div class="card"><b>An anchor worth keeping</b><p class="tiny">'+esc(rows.find(r=>r.note)?.note||'Keep a question or a small observation after class. It can be something to return to next time.')+'</p></div><p class="tiny">These records describe time, not your worth. Breaks count separately from present time.</p>'}
function preferences(){return bar('Preferences','Profile','go("profile")')+heading('Support, on your terms.','Keep what helps. Change what doesn’t.')+menu('My profile','Edit name & icon · '+selfID,'users','go("profile")')+menu('Friends & study groups',S.friends.length+' friends · requests and group invitations','users','go("friends")')+'<div class="label">Your focus plan</div>'+menu('My timetable','Add, edit and remove classes manually','calendar','S.previewEdit=false;go("timetable")')+menu('Customize notifications',S.settings.tone+' tone · '+(S.settings.sound?'Sound':'Silent')+' · Custom message','bell','go("notifications")')+menu('Reminder timing','Before class · '+S.settings.duringSeconds+'-second check-ins · Lecture breaks','clock','go("reminders")')+menu('Entertainment apps',S.settings.apps.slice(0,3).join(', ')+' · '+S.settings.apps.length+' selected','phone','go("apps")')+(IS_NATIVE?menu('App usage reminders',S.nativeMonitoring.enabled?'Screen Time monitoring is on':'Choose apps with iOS Screen Time','clock','native("monitorSettings",{settings:S.settings})'):'')+'<div class="label">About Lectra</div>'+menu('Privacy & help','Your choices and practical questions','help','go("help")')+'<p class="tiny" style="margin-top:26px">Study tools stay available. Nothing gets blocked.</p><details class="demo-tools"><summary>Demo scenarios & restart</summary>'+B('Automatic timetable entry at 10:00','autoDemo()','secondary','clock')+B('Load the Figma reflection week','exampleWeek()','secondary','reflections')+B('Try the Mia friend-request scenario','friendScenario()','secondary','users')+B('Show ranking empty state','S.rankWeek=1;setTab("ranking")','secondary','ranking')+B('View opening logo screen','go("splash")','secondary')+B('Restart this demo','reset()','secondary')+'</details>'}
function notificationPreview(){return '<div class="card soft"><div class="label" style="margin-top:0">Reminder preview</div><div class="person" style="margin:10px 0">'+I('bell')+'<span>Noted</span><span class="tiny" style="margin-left:auto">now</span></div><b>'+esc(S.settings.message)+'</b><p class="tiny">Cognitive Psychology · '+S.settings.tone+' · '+(S.settings.sound?'Sound':'Silent')+'</p></div>'}
function chooseTone(tone){S.settings.tone=tone;S.settings.message=tone==='Gentle'?'Want to come back to the next idea?':'Return to your lecture.';render(true)}
function notifications(){return bar('Customize notifications','Preferences','setTab("preferences")')+heading('A reminder that feels like you.','Choose how Noted checks in. Keep what helps.')+toggle('Enable notifications','You can turn reminders off at any time.','S.settings.notifications',S.settings.notifications)+'<div class="label">Wording</div>'+chipOptions([{label:'Gentle',value:'Gentle'},{label:'Simple',value:'Simple'}],S.settings.tone,'chooseTone($VALUE)')+'<p class="tiny">Quiet wording, no judgement.</p>'+field('Your reminder message','notificationMessage',S.settings.message,'text','S.settings.message=this.value')+T('Use the default message','chooseTone(S.settings.tone)')+notificationPreview()+'<div class="label">Sound & feel</div>'+chipOptions([{label:'Silent',value:false},{label:'Sound',value:true}],S.settings.sound,'S.settings.sound=$VALUE;render(true)')+toggle('Vibration','Off for a quiet nudge.','S.settings.vibration',S.settings.vibration)+'<p class="tiny">These are preferences in Lectra. Your phone’s settings determine how notifications look, sound and arrive.</p>'+B('Save notifications','if(!S.settings.message.trim()){toast("Enter a reminder message");return}syncNative();native("requestNotifications",{enabled:S.settings.notifications});setTab("preferences");toast("Notification preferences saved")','primary','check')}
function reminders(){return bar('Reminder timing','Preferences','setTab("preferences")')+heading('A little nudge, when it helps.','Set a rhythm that leaves room to learn.')+'<div class="label">Scheduled reminders</div>'+toggle('Before class','A moment to get ready.','S.settings.before',S.settings.before)+'<div class="field"><label for="beforeMinutes">Remind me before class</label><select id="beforeMinutes" onchange="S.settings.beforeMinutes=+this.value">'+[1,5,10,15,30].map(v=>'<option value="'+v+'" '+(S.settings.beforeMinutes===v?'selected':'')+'>'+v+' minutes</option>').join('')+'</select></div>'+toggle('During lecture','Nudge me when I open entertainment apps.','S.settings.during',S.settings.during)+chipOptions([{label:'15 sec',value:15},{label:'30 sec (Default)',value:30},{label:'1 min',value:60},{label:'Custom',value:0}],[15,30,60].includes(S.settings.duringSeconds)?S.settings.duringSeconds:0,'S.settings.duringSeconds=$VALUE||S.settings.duringCustom;render(true)')+field('Custom interval (seconds)','customDuring',S.settings.duringCustom,'number','S.settings.duringCustom=+this.value;if(![15,30,60].includes(S.settings.duringSeconds))S.settings.duringSeconds=+this.value')+'<p class="tiny">Not a restriction. Just a chance to notice the autopilot.</p>'+toggle('When a break finishes','A gentle invitation to return, if class is still on.','S.settings.breakReminder',S.settings.breakReminder)+chipOptions([{label:'3 mins',value:3},{label:'5 mins (Default)',value:5},{label:'10 min',value:10},{label:'Custom',value:0}],[3,5,10].includes(S.settings.breakMinutes)?S.settings.breakMinutes:0,'S.settings.breakMinutes=$VALUE||S.settings.breakCustom;render(true)')+field('Custom interval (minutes)','customBreak',S.settings.breakCustom,'number','S.settings.breakCustom=+this.value;if(![3,5,10].includes(S.settings.breakMinutes))S.settings.breakMinutes=+this.value')+'<p class="tiny">This is just a nudge, you can always choose to keep resting.</p><div class="action-stack">'+B('Save timing','saveTiming()','primary','check')+T('Back to notifications','go("notifications")')+'</div>'}
function saveTiming(){if(!Number.isFinite(S.settings.duringSeconds)||S.settings.duringSeconds<5||S.settings.duringSeconds>3600){toast('Choose a check-in interval from 5 to 3600 seconds');return}if(!Number.isFinite(S.settings.breakMinutes)||S.settings.breakMinutes<1||S.settings.breakMinutes>60){toast('Choose a break from 1 to 60 minutes');return}syncNative();setTab('preferences');toast('Reminder timing saved')}
function appsView(){return bar('Entertainment apps')+appChoices()+B('Confirm '+S.settings.apps.length+' apps','syncNative();setTab("preferences");toast("Entertainment app choices saved")','primary','check')+'<p class="footer-note">You can change this list any time.</p>'}
function profile(){let t=totals();return bar('My profile','Today','setTab("today")')+heading('Your little corner.')+personRow(selfID,selfID+' · Your permanent user ID',T('Copy','copyText(selfID)'))+B('Edit name & icon','S.profileDraft=S.user;go("profileEdit")','secondary','edit')+menu('Friends & study groups',S.friends.length+' friends · requests and group invitations','users','go("friends")')+menu('My QR code','Let a friend find your profile','qr','go("myqr")')+menu('My timetable','Calendar preview & manual class editor','calendar','go("timetable")')+'<button class="card soft list-button" onclick="setTab(\'ranking\')"><div class="label" style="margin-top:0">This week · '+rankRange()+'</div><div class="large-number">'+pct(t.focus,t.scheduled)+'</div><p class="tiny">'+Math.round(t.focus*10)/10+' focused / '+t.scheduled+' scheduled min</p><p class="tiny">View ranking →</p></button><p class="tiny">Find this profile any time from your avatar on Today.</p>'}
function profileEdit(){return bar('Edit profile','Cancel','go("profile")')+heading('Still you, a little updated.','Change how friends see you. Your ID stays with you.')+avatar(selfID,true)+'<p class="tiny center">Current icon · '+esc(S.avatar)+'</p><div class="center">'+T('Change simple icon','openAvatar("profileEdit")')+'<br>'+T('Choose from gallery','S.profileOrigin="profileEdit";S.pendingPhoto="";go("gallery")')+'</div>'+field('Display name','profileName',S.profileDraft||S.user,'text','S.profileDraft=this.value')+'<p class="tiny">Your name can change. Friends find the same profile using your ID.</p><div class="field"><label>User ID · cannot be edited</label><input readonly value="'+selfID+'"></div><div class="notice">Changing your name or avatar won’t change your friends, groups or recorded lecture history.</div>'+B('Save changes','if(!S.profileDraft.trim()){toast("Enter your display name");return}S.user=S.profileDraft.trim();go("profile");toast("Profile saved")','primary','check')}
function avatarView(){return bar('Choose an icon','Today','setTab("today")')+heading('A small mark of you.','Pick a simple icon. No photo needed.')+'<div class="avatar big">'+I(S.avatarDraft)+'</div><p class="center tiny" style="color:var(--navy)">Choose an icon for your Today profile</p><div class="icon-grid">'+iconNames.map(n=>'<button class="'+(S.avatarDraft===n.toLowerCase()?'selected':'')+'" onclick="S.avatarDraft='+act(JSON.stringify(n.toLowerCase()))+';render(true)">'+I(n.toLowerCase())+'<span>'+n+'</span></button>').join('')+'</div>'+B('Save selection','saveAvatar()','primary','check')+B('Choose from gallery','S.pendingPhoto="";go("gallery")','secondary','image')}
function gallery(){return bar('Profile photo','Cancel','back()')+heading('Choose your frame.','A preview of selecting a profile photo from your phone.')+'<div class="card"><div class="photo-preview">'+(S.pendingPhoto?'<img alt="Selected profile image" src="'+S.pendingPhoto+'">':'<div class="avatar big">'+I(S.galleryChoice)+'</div>')+'</div><p class="tiny center">Profile crop preview</p></div><div class="label">Gallery picker · concept preview</div><div class="icon-grid">'+['user','mountain','bloom','book','tree','sun'].map(n=>'<button class="'+(!S.pendingPhoto&&S.galleryChoice===n?'selected':'')+'" onclick="S.pendingPhoto=\'\';S.galleryChoice='+act(JSON.stringify(n))+';render(true)">'+I(n)+'</button>').join('')+'</div>'+B('Choose a photo from device','chooseProfilePhoto()','secondary','image')+'<p class="tiny">The tiles are illustrative. You choose which photo to share with this app.</p>'+B('Confirm selected photo','confirmProfilePhoto()','primary','check')}
function chooseProfilePhoto(){if(native('avatarPhoto'))return;$('#avatarFile').click()}
function confirmProfilePhoto(){if(S.pendingPhoto){S.avatarPhoto=S.pendingPhoto;S.pendingPhoto=''}else{S.avatar=S.galleryChoice;S.avatarPhoto=''}S.page=S.profileOrigin||'profile';S.history=[];render();toast('Profile photo saved')}
function friends(){return bar('Friends & groups','Profile','go("profile")')+heading('Good company, gently.','Connect first. Choose a study group together.')+S.incoming.map(id=>'<div class="card"><div class="label" style="margin-top:0">Incoming request · '+S.incoming.length+'</div>'+personRow(id)+'<p class="tiny">'+esc(person(id).name.split(' ')[0])+' would like to be your friend.</p><div class="row">'+B('Accept','acceptIncoming('+JSON.stringify(id)+')')+B('Decline','declineIncoming('+JSON.stringify(id)+')','secondary')+'</div></div>').join('')+'<div class="label">Your friends · '+S.friends.length+'</div>'+S.friends.map(id=>'<button class="plain" style="display:block;width:100%;text-align:left" onclick="S.friendTarget='+act(JSON.stringify(id))+';go(\'friendPreview\')">'+personRow(id)+'</button>').join('')+(S.friends.length?'':'<p class="tiny">No friends yet. Add a friend by their permanent ID.</p>')+(S.outgoing.length?'<div class="label">Requests sent · pending</div>'+S.outgoing.map(id=>'<button class="plain" style="display:block;width:100%;text-align:left" onclick="S.friendTarget='+act(JSON.stringify(id))+';go(\'friendPending\')">'+personRow(id,'Waiting for acceptance')+'</button>').join(''):'')+menu('Study groups','Invite accepted friends · '+S.groups.length+' groups','users','go("groups")')+menu('My QR','Share your profile preview','qr','go("myqr")')+'<div class="action-stack">'+B('Add friend by ID','S.friendError="";go("friendAdd")','primary','users')+'</div>'}
function friendAdd(notFound=false){return bar('Add a friend','Friends','go("friends")')+heading(notFound?'Let’s check that ID.':'Find a familiar face.',notFound?S.friendError:'Ask your friend for their Noted user ID.')+field(notFound?'Friend’s user ID · edit to retry':'Friend’s user ID','friendID',S.friendID,'text','S.friendID=this.value')+'<p class="tiny">'+(notFound?'Ask your friend to copy their ID from their profile. Check each letter and number, including the NT- prefix.':'Use their permanent ID, not their display name. Names can be shared by more than one person.')+'</p><div class="soft"><div class="label" style="margin-top:0">'+(notFound?'Another way to find them':'A little check before connecting')+'</div><p class="tiny">'+(notFound?'Try their friend QR instead. You’ll still verify their profile before sending a request.':'You’ll see a profile first. Check the name and icon, then choose whether to send a request.')+'</p></div>'+menu('Where’s my ID?','Your profile · below your display name','help','go("profile")')+'<div class="action-stack">'+B(notFound?'Try this ID again':'Find profile','lookupFriend()','primary','search')+B('Scan QR instead','go("scan")','secondary','scan')+'</div>'}
function friendPreview(){let id=S.friendTarget,p=person(id),connected=S.friends.includes(id),pending=S.outgoing.includes(id);return bar('Profile found','Search','go("friendAdd")')+heading('Is this your friend?','Take a moment to check before you connect.')+'<div class="card center">'+avatar(id,true)+'<h2>'+esc(p.name)+'</h2><p style="color:var(--navy)">'+esc(id)+'</p><p class="tiny">Permanent user ID · exact match</p></div><div class="soft"><div class="label" style="margin-top:0">'+(connected?'You’re friends':pending?'Request is pending':'You’re not friends yet')+'</div><p class="tiny">'+(connected?'You can choose to invite this friend to a study group.':pending?'Your friend can choose whether to connect.':'A request lets '+esc(p.name.split(' ')[0])+' choose whether to connect. You’ll become friends only after they accept.')+'</p></div><p class="tiny">A QR scan leads to this same identity check before a request is sent.</p><div class="action-stack">'+(connected?B('View study groups','go("groups")','primary','users'):pending?B('View pending request','go("friendPending")','primary','send'):B('Send friend request','sendRequest()','primary','users'))+B('Not the right person? Search again','go("friendAdd")','secondary')+'</div>'}
function friendPending(){let p=person(S.friendTarget);return bar('Friend request','Friends','go("friends")')+'<div class="empty"><div class="avatar big">'+I('send')+'</div></div>'+heading('A hello is on its way.','Your friend request has been sent to '+p.name+'.')+'<div class="card"><div class="label" style="margin-top:0">Pending · Waiting for '+esc(p.name.split(' ')[0])+'</div>'+personRow(p.id)+'<p class="tiny">You’re not friends yet. '+esc(p.name.split(' ')[0])+' needs to accept your request before they appear in your friends list.</p></div><p class="tiny">Once accepted, you can invite them to a study group. A friend request doesn’t create a group.</p><div class="action-stack">'+B('Back to friends','go("friends")','primary','arrow')+T('Preview acceptance (Demo)','acceptOutgoing()')+'</div>'}
function scan(){return bar('Scan friend QR','Friends','go("friends")')+heading('A quick way to say hello.','Place your friend’s Noted QR inside the frame.')+'<div class="scan-box"><div class="scan-frame">'+I('scan')+'</div><span class="micro">CAMERA PREVIEW · NOT ACTIVE</span></div><p class="tiny">This demo uses a sample scan. It doesn’t use your camera.</p><div class="card"><div class="label" style="margin-top:0">Scan → Verify → Request</div><p class="tiny">A scan opens the matching profile, not an automatic friendship. Check their name and ID before sending a request.</p></div>'+B('Try sample QR scan','S.friendTarget="NT-4P8R2H";go("friendPreview")','primary','camera')+B('Enter user ID instead','go("friendAdd")','secondary')}
function qrPattern(){let rects='';function dot(x,y){rects+='<rect x="'+x+'" y="'+y+'" width="1" height="1"/>'}for(let y=0;y<29;y++)for(let x=0;x<29;x++){let find=(x<9&&y<9)||(x>19&&y<9)||(x<9&&y>19);if(!find&&((x*7+y*11+x*y)%5<2))dot(x,y)}[[1,1],[21,1],[1,21]].forEach(([x,y])=>{rects+='<path fill-rule="evenodd" d="M'+x+' '+y+'h7v7h-7zM'+(x+1)+' '+(y+1)+'h5v5h-5z"/><rect x="'+(x+2)+'" y="'+(y+2)+'" width="3" height="3"/>'});return '<svg class="qr" viewBox="0 0 29 29" role="img" aria-label="Illustrative QR preview, not scannable">'+rects+'</svg>'}
function myqr(){return bar('My QR code','Profile','go("profile")')+heading('An invitation to connect.','Your friends can check your profile before sending a request.')+'<div class="card center">'+avatar(selfID)+'<h2>'+esc(S.user)+'</h2><p style="color:var(--navy)">'+selfID+'</p>'+qrPattern()+'<div class="micro" style="color:var(--navy)">PREVIEW / ILLUSTRATIVE · NOT SCANNABLE</div></div><p class="tiny">Your permanent user ID stays the same even if you change your name or icon.</p>'+B('Share QR preview','shareProfile()','primary','share')+B('Copy user ID','copyText(selfID)','secondary','copy')}
function groups(){return bar('Study groups','Friends','go("friends")')+heading('Make room together.','Small circles for sharing a little lecture focus.')+S.groups.map((g,i)=>'<div class="card '+(i===0?'soft':'')+'"><div class="label" style="margin-top:0">'+(i===0?'Your group · invitations in progress':'Your circle')+'</div><h2>'+esc(g.name)+'</h2><p class="tiny">'+g.members.length+' members · '+g.pending.length+' pending invitation(s)</p>'+menu('Open '+g.name,'See members and invite status','users','openGroup('+JSON.stringify(g.id)+')')+menu('Group ranking','Accepted members only','ranking','openGroupRank('+JSON.stringify(g.id)+')')+'</div>').join('')+'<p class="tiny">Invite friends who have already accepted your friend request. They still choose whether to join each group.</p><p class="tiny">Adding a friend never creates a group automatically.</p>'+B('Create study group','openGroupForm()','primary','plus')}
function groupForm(){return bar('Create study group','Cancel','go("groups")')+heading('Start a small circle.','Choose the friends you’d like to study alongside.')+field('Group name','groupName',S.groupDraftName,'text','S.groupDraftName=this.value')+'<div class="card soft">'+personRow(selfID,'You · included as group owner','<span class="tiny">Included</span>')+'</div><div class="label">Invite accepted friends · '+S.groupDraftMembers.length+' selected</div>'+S.friends.map(id=>'<button class="plain" style="display:block;width:100%;text-align:left" onclick="toggleGroupFriend('+act(JSON.stringify(id))+')">'+personRow(id,person(id).id,'<span class="check" style="'+(S.groupDraftMembers.includes(id)?'color:var(--navy);border-color:var(--navy)':'')+'">'+(S.groupDraftMembers.includes(id)?'✓':'')+'</span>')+'</button>').join('')+(S.friends.length?'':'<p class="tiny">Connect with a friend first, then invite them from your group page.</p>')+'<div class="card"><p class="tiny">Being friends doesn’t make someone a group member. Invitees receive a separate invitation to accept.</p></div>'+(S.groupError?'<p class="error">'+esc(S.groupError)+'</p>':'')+B('Create group & send invitations','createGroup()','primary','users')+'<p class="footer-note">You join now. Invitees join only after accepting.</p>'}
function groupDetail(){let g=selectedGroup();if(!g)return groups();return bar(g.name,'Groups','go("groups")')+heading(g.name,'A little encouragement, one lecture at a time.')+'<div class="card soft"><b>'+g.members.length+' members · '+g.pending.length+' invitation(s) pending</b><p class="tiny">You manage this group. Members choose when to join.</p></div><div class="label">Accepted members</div>'+g.members.map(id=>personRow(id,person(id).id+' · '+(id===selfID?'You, owner':'Joined'))).join('')+(g.pending.length?'<div class="card"><div class="label" style="margin-top:0">Invitation pending</div>'+g.pending.map(id=>personRow(id,person(id).id,'<span class="tiny" style="color:var(--navy)">Pending</span>')+'<p class="tiny">'+esc(person(id).name.split(' ')[0])+' hasn’t joined yet and isn’t in this group’s standings.</p>').join('')+'</div>':'<p class="tiny">No invitations are waiting.</p>')+menu('Group ranking','Compare accepted members’ completed lectures','ranking','openGroupRank('+JSON.stringify(g.id)+')')+menu('Manage group','Name, members & invitations','preferences','go("groupManage")')+'<div class="action-stack">'+B('Invite friends','go("groupInvite")','primary','users')+'</div>'}
function groupInvite(){let g=selectedGroup(),eligible=S.friends.filter(id=>!g.members.includes(id)&&!g.pending.includes(id));return bar('Invite friends','Groups','go("groupdetail")')+heading('Choose your company.','Only accepted friends can be invited. They choose whether to join this group.')+eligible.map(id=>'<div class="card">'+personRow(id)+B('Send group invitation','inviteToGroup('+JSON.stringify(id)+')','secondary','send')+'</div>').join('')+(eligible.length?'':'<div class="empty"><p class="muted">Every accepted friend is already a member or has an invitation pending.</p>'+B('Add another friend','go("friendAdd")','secondary','users')+'</div>')}
function groupManage(){let g=selectedGroup();return bar('Manage group','Group','go("groupdetail")')+heading('Your circle, with care.')+field('Group name','groupRename',g.name)+B('Save group name','renameGroup()','secondary','check')+'<div class="label">Accepted members</div>'+g.members.map(id=>'<div>'+personRow(id,person(id).id,id!==selfID?T('Remove','removeGroupMember('+JSON.stringify(id)+')'):'<span class="tiny">Owner</span>')+'</div>').join('')+'<div class="label">Pending invitations</div>'+g.pending.map(id=>'<div class="card">'+personRow(id,'Pending')+B('Preview their acceptance (Demo)','acceptGroup('+JSON.stringify(id)+')','secondary','check')+T('Cancel invitation','cancelGroupInvite('+JSON.stringify(id)+')')+'</div>').join('')+B('Invite accepted friends','go("groupInvite")','primary','users')}

function ranking(){let rows=periodRecords(),t=totals(rows),g=S.groups.find(x=>x.id===S.rankGroup)||S.groups[0];let out=bar('Ranking','Friends & groups','go("friends")')+heading(rows.length?(S.rankTab==='global'?'A wider perspective.':'Presence, in good company.'):'A fresh week ahead.',rankRange()+' · Weekly recorded focus')+'<div class="calendar-head" style="margin-top:4px"><button aria-label="Previous ranking week" onclick="S.rankWeek--;render()">'+I('arrow')+'</button><span>Weekly period</span><button aria-label="Next ranking week" onclick="S.rankWeek++;render()">'+I('next')+'</button></div>'+rankingTabs();if(!rows.length){return out+'<div class="card"><b>'+esc(g?.name||'My groups')+' · '+(S.rankTab==='global'?'Global':'My groups')+'</b><p class="tiny">Global uses the same completed-lecture rule.</p></div><div class="empty"><div class="avatar big">'+I('book')+'</div></div><div class="soft"><div class="label" style="margin-top:0">Your status</div><h2>Not yet ranked</h2><p class="tiny">No completed lectures this period. This is not a 0% score.</p></div><p class="muted">Make space for your first lecture. A percentage appears after a lecture is completed; in-progress time doesn’t enter the standings.</p>'+B('Go to Today','setTab("today")','primary','next')+T('View the illustrative Figma week','exampleWeek();setTab("ranking")')+(S.rankTab==='global'?'<div class="card">'+toggle('Join public ranking',S.global?'On · your demo profile is listed':'Off · your profile is not listed','S.global',S.global)+'<p class="tiny">This participation choice is local to the demo.</p></div>':'')+menu('How ranking works','Minutes weighted by lecture duration','help','go("rankingRules")')}
if(S.rankTab==='groups'){out+='<div class="field"><select aria-label="Choose study group" onchange="S.rankGroup=this.value;render()">'+S.groups.map(x=>'<option value="'+x.id+'" '+(g?.id===x.id?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></div><div class="label">Focused / scheduled · completed lectures</div>';let standings=(g?.members||[selfID]).map(id=>{let p=person(id);return {p,focus:id===selfID?t.focus:p.focus||0,scheduled:id===selfID?t.scheduled:p.scheduled||0}}).filter(x=>x.scheduled>0).sort((a,b)=>b.focus/b.scheduled-a.focus/a.scheduled);out+=standings.map((x,i)=>rankingRow(i+1,x.p,x.focus,x.scheduled,x.p.id===selfID)).join('')+'<p class="tiny">'+(g?.members.length||0)+' accepted members. Pending invitees are excluded from this group’s standings.</p>'}
else{out+='<div class="label">Global · illustrative standings</div>';[['Jamie Park','sun',345,360],['Taylor Liu','bird',342,360],['Robin Ng','shell',340,360]].forEach((x,i)=>out+=rankingRow(i+1,{name:x[0],icon:x[1]},x[2],x[3]));out+='<div class="label">Your position · '+(S.global?'Public participation':'Private preview')+'</div>'+rankingRow(128,{name:S.user,icon:S.avatar},t.focus,t.scheduled,true)+'<div class="card">'+toggle('Join public ranking',S.global?'On · your demo profile is listed':'Off · your profile is not listed','S.global',S.global)+'<p class="tiny">Choose to show your display name, icon and percentage publicly. #128 is an illustrative position, not a live shared listing.</p></div>'}
return out+menu('How ranking works','Minutes weighted by lecture duration','help','go("rankingRules")')+'<p class="tiny">Recorded time, not a measure of your worth.</p>'}
function rankingRules(){let rows=periodRecords(),t=totals(rows);return bar('How ranking works','Ranking','setTab("ranking")')+heading('Time, not a perfect score.','A shared way to compare recorded lecture time.')+'<div class="card soft"><div class="label" style="margin-top:0">Focus percentage</div><h2 style="color:var(--navy)">Total focused minutes ÷ total scheduled minutes × 100</h2><p class="tiny">Only completed lectures in the selected period count. Longer lectures carry more weight; we don’t average individual course percentages.</p></div><div class="card"><div class="label" style="margin-top:0">'+esc(S.user)+'’s week · '+rankRange()+'</div>'+rows.map(r=>'<div class="rule-example"><span>'+esc(r.courseName)+'</span><span>'+r.focusMinutes+' / '+r.scheduledMinutes+'</span></div>').join('')+'<h2>'+Math.round(t.focus*10)/10+' / '+t.scheduled+' × 100 = '+pct(t.focus,t.scheduled)+'</h2><p class="tiny">Focused / scheduled minutes · '+rows.length+' lectures</p></div><h3>The whole lecture stays in view</h3><p class="tiny">Breaks and distraction remain in the scheduled denominator and aren’t focused time. Ending a session early does not shorten its scheduled minutes.</p><h3>A consistent weekly window</h3><p class="tiny">Group and global standings use the same selected period. Pending group invitations are excluded until the invitee joins.</p>'+B('Back to ranking','setTab("ranking")','secondary','arrow')}

function parseOCR(text){let found=[],day=1;for(const line of text.split(/\n/).map(x=>x.trim()).filter(Boolean)){let d=line.match(/\b(mon|tue|wed|thu|fri|星期[一二三四五])\b/i);if(d){let k=d[1].toLowerCase();day=/^(tue|星期二)/.test(k)?2:/^(wed|星期三)/.test(k)?3:/^(thu|星期四)/.test(k)?4:/^(fri|星期五)/.test(k)?5:1}let m=line.match(/(\d{1,2})[:：](\d{2})\s*[-–—~至到]\s*(\d{1,2})[:：](\d{2})/);if(m){let name=line.replace(m[0],'').replace(/星期[一二三四五]/,'').trim()||'Imported class';found.push({name,teacher:'',place:'',day,start:m[1].padStart(2,'0')+':'+m[2],end:m[3].padStart(2,'0')+':'+m[4],done:false})}}return found}
async function detectGridCourses(file,data){const lines=(data.words&&data.words.length?data.words:(data.lines||[])).filter(x=>x.text&&x.bbox),bitmap=await createImageBitmap(file),factor=Math.min(1,700/bitmap.width),canvas=document.createElement('canvas');canvas.width=Math.round(bitmap.width*factor);canvas.height=Math.round(bitmap.height*factor);const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);const pix=ctx.getImageData(0,0,canvas.width,canvas.height).data,w=canvas.width,h=canvas.height,n=w*h,mask=new Uint8Array(n),seen=new Uint8Array(n);for(let y=0;y<h;y++)for(let x=0;x<w;x++){let k=(y*w+x)*4,r=pix[k],g=pix[k+1],b=pix[k+2];if(Math.max(r,g,b)>165&&Math.max(r,g,b)-Math.min(r,g,b)>20&&r+g+b>500)mask[y*w+x]=1}let q=new Int32Array(n),boxes=[];for(let i=0;i<n;i++){if(!mask[i]||seen[i])continue;let head=0,tail=0,minx=w,miny=h,maxx=0,maxy=0;seen[i]=1;q[tail++]=i;while(head<tail){let at=q[head++],x=at%w,y=(at/w)|0;minx=Math.min(minx,x);maxx=Math.max(maxx,x);miny=Math.min(miny,y);maxy=Math.max(maxy,y);for(let yy=Math.max(0,y-1);yy<=Math.min(h-1,y+1);yy++)for(let xx=Math.max(0,x-1);xx<=Math.min(w-1,x+1);xx++){let j=yy*w+xx;if(mask[j]&&!seen[j]){seen[j]=1;q[tail++]=j}}}let bw=maxx-minx+1,bh=maxy-miny+1;if(tail>220&&bw>18&&bh>14&&bw/bh>.22&&bw/bh<2.4)boxes.push({x0:minx,y0:miny,x1:maxx,y1:maxy,cx:(minx+maxx)/2,cy:(miny+maxy)/2})}const ocr=lines.map(l=>({text:l.text.trim(),x0:l.bbox.x0*factor,y0:l.bbox.y0*factor,x1:l.bbox.x1*factor,y1:l.bbox.y1*factor,cx:(l.bbox.x0+l.bbox.x1)/2*factor,cy:(l.bbox.y0+l.bbox.y1)/2*factor}));const ticks=ocr.map(l=>{let m=l.text.match(/^([0-2]?\d)[:：.](\d{2})$/);return m?{y:l.cy,t:+m[1]*60+(+m[2]),x:l.cx}:null}).filter(Boolean).sort((a,b)=>a.y-b.y);if(boxes.length<2||ticks.length<2)return[];let firstY=ticks[0].y,lastY=ticks[ticks.length-1].y;let headers=ocr.filter(l=>l.cy<firstY-8&&/^(mo|mon(day)?|tu|tue(sday)?|we|wed(nesday)?|th|thu(rsday)?|fr|fri(day)?|星期[一二三四五])$/i.test(l.text)).sort((a,b)=>a.cx-b.cx);let dayXs=headers.length>=3?headers.map(x=>x.cx):[];if(dayXs.length<3){let xs=boxes.filter(b=>b.cy>firstY-8&&b.cy<lastY).map(b=>b.cx).sort((a,b)=>a-b);dayXs=[];for(const x of xs){if(!dayXs.length||x-dayXs.at(-1)>w*.09)dayXs.push(x);else dayXs[dayXs.length-1]=(dayXs.at(-1)+x)/2}if(dayXs.length>5)dayXs=dayXs.slice(0,5)}if(dayXs.length<3)return[];const interp=y=>{for(let i=1;i<ticks.length;i++)if(y<=ticks[i].y){let a=ticks[i-1],b=ticks[i];return a.t+(y-a.y)*(b.t-a.t)/(b.y-a.y)}let a=ticks[ticks.length-2],b=ticks.at(-1);return b.t+(y-b.y)*(b.t-a.t)/(b.y-a.y)};const snap=t=>Math.max(0,Math.round(t/5)*5),fmt=t=>String(Math.floor(t/60)%24).padStart(2,'0')+':'+String(t%60).padStart(2,'0');const cropWorker=await Tesseract.createWorker('eng');await cropWorker.setParameters({tessedit_pageseg_mode:'6',preserve_interword_spaces:'1'});let out=[];for(const b of boxes){if(b.cy<firstY-5||b.cy>lastY+30)continue;let d=0;for(let j=1;j<dayXs.length;j++)if(Math.abs(b.cx-dayXs[j])<Math.abs(b.cx-dayXs[d]))d=j;let sx=Math.max(0,Math.floor((b.x0-5)/factor)),sy=Math.max(0,Math.floor((b.y0-5)/factor)),sw=Math.min(bitmap.width-sx,Math.ceil((b.x1-b.x0+10)/factor)),sh=Math.min(bitmap.height-sy,Math.ceil((b.y1-b.y0+10)/factor));let crop=document.createElement('canvas');crop.width=Math.max(1,sw*3);crop.height=Math.max(1,sh*3);crop.getContext('2d').drawImage(bitmap,sx,sy,sw,sh,0,0,crop.width,crop.height);let txt='';try{const read=await cropWorker.recognize(crop);txt=(read.data.text||'').replace(/\s+/g,' ').trim()}catch(_){txt=ocr.filter(l=>l.cx>=b.x0-3&&l.cx<=b.x1+3&&l.cy>=b.y0-3&&l.cy<=b.y1+3).sort((a,c)=>a.cy-c.cy).map(x=>x.text).join(' ').replace(/\s+/g,' ').trim()}if(!txt)continue;let start=snap(interp(b.y0)),end=snap(interp(b.y1));if(end<=start)end=start+60;out.push({name:txt,teacher:'',place:'',day:d+1,start:fmt(start),end:fmt(end),done:false,uncertain:true})}await cropWorker.terminate();bitmap.close();return out.filter(c=>Number(c.start.slice(0,2))>=6&&Number(c.end.slice(0,2))<=23)}
let ocrGeneration=0;
async function loadRecognition(){if(window.Tesseract)return;await new Promise((resolve,reject)=>{let existing=document.getElementById('ocr-library');if(existing){existing.addEventListener('load',resolve,{once:true});existing.addEventListener('error',reject,{once:true});if(window.Tesseract)resolve();return}let script=document.createElement('script');script.id='ocr-library';script.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';script.onload=resolve;script.onerror=()=>{script.remove();reject(Error('Recognition could not load. Check your connection and choose the image again.'))};document.head.append(script)})}
function cleanRecognizedCourse(row,index){let text=(row.name||'').replace(/\s+/g,' ').trim().replace(/\b1SOM\b/g,'ISOM').replace(/\bIS0M\b/g,'ISOM').replace(/\bF1NA\b/g,'FINA');let code=text.match(/\b([A-Z]{3,5})\s*(\d{4})\b/i),section=text.match(/\b(LA|L|T)\s*([0-9OIl]{1,3})\b/i);if(code)text=code[1].toUpperCase()+' '+code[2];if(!code&&/^(LA|L|T)\s*[0-9OIl]+$/i.test(text))return null;return {...row,id:'import-'+Date.now()+'-'+index,name:text,section:section?section[1].toUpperCase()+section[2].replace(/[OI]/g,'0').replace(/l/g,'1'):(row.section||''),topic:row.topic||'',teacher:row.teacher||'',place:row.place||'',repeat:true,color:index%5,uncertain:row.uncertain!==false}}
function chooseTimetable(){if(S.page!=='photoReview')S.ocrOrigin=S.page==='setupSchedule'?'setupSchedule':'timetable';if(native('importTimetable')){S.ocrBusy=true;S.ocrCourses=[];S.ocrStatus='Choose a timetable photo. Recognition runs on this device.';go('photoReview');return}$('#timetableFile').click()}
async function handleTimetableImage(event){let file=event.target.files?.[0];if(!file)return;let generation=++ocrGeneration;S.ocrFileName=file.name;if(S.ocrImage?.startsWith('blob:'))URL.revokeObjectURL(S.ocrImage);S.ocrImage=URL.createObjectURL(file);S.ocrCourses=[];S.ocrBusy=true;S.ocrStatus='Preparing timetable recognition…';go('photoReview');let worker;try{await loadRecognition();worker=await Tesseract.createWorker('eng+chi_tra',1,{logger:m=>{if(generation===ocrGeneration&&m.status==='recognizing text'){S.ocrStatus='Reading the timetable… '+Math.round((m.progress||0)*100)+'%';let el=$('#ocrStatus');if(el)el.textContent=S.ocrStatus}}});await worker.setParameters({tessedit_pageseg_mode:'11',preserve_interword_spaces:'1'});let result=await worker.recognize(file);let rows=await detectGridCourses(file,result.data);if(!rows.length)rows=parseOCR(result.data.text||'');rows=rows.map(cleanRecognizedCourse).filter(c=>c&&c.name);if(generation!==ocrGeneration)return;S.ocrCourses=rows;S.ocrStatus=rows.length?'Found '+rows.length+' possible classes. Course names, weekdays and inferred times need your review.':'No complete course blocks could be matched to readable weekday and time labels. Choose a clearer full timetable or add the classes manually.'}catch(error){if(generation===ocrGeneration)S.ocrStatus=error.message||'This image could not be recognized. Try another image or add classes manually.'}finally{if(worker)await worker.terminate();if(generation===ocrGeneration){S.ocrBusy=false;render(true)}event.target.value=''}}
function sampleImport(){S.ocrOrigin=S.page==='setupSchedule'?'setupSchedule':'timetable';S.ocrImage='';S.ocrFileName='Illustrative imported timetable · 12 course blocks';let specs=[['ISOM 2700','L3',2,'09:00','10:20'],['ISOM 2700','L3',4,'09:00','10:20'],['FINA 2303','L6',1,'10:30','11:50'],['FINA 2303','L6',3,'10:30','11:50'],['ISOM 2010','L03',2,'13:30','14:50'],['ISOM 2010','L03',4,'13:30','14:50'],['ISOM 2010','LA01',1,'15:00','15:50'],['ISOM 2020','L09',3,'14:00','15:50'],['PHYS 1101','L2',2,'15:30','17:20'],['PHYS 1101','L2',4,'15:30','17:20'],['ISOM 2020','LA06',3,'16:30','18:20'],['PHYS 1101','T3',4,'18:00','18:50']];S.ocrCourses=specs.map((x,i)=>({id:'sample-import-'+i,name:x[0],section:x[1],day:x[2],start:x[3],end:x[4],teacher:'',place:'',topic:'',repeat:true,color:i%5,uncertain:true}));S.ocrStatus='12 course blocks · check times. This sample demonstrates the review flow; exact boundaries need checking.';S.ocrBusy=false;go('photoReview')}
function confirmImport(){let rows=S.ocrCourses;if(!rows.length){toast('Add or detect at least one lecture first');return}let invalid=rows.find(c=>!c.name?.trim()||!c.start||!c.end||mins(c.end)<=mins(c.start));if(invalid){toast('Check every course name and time before saving');S.previewEdit=true;go('courseList');return}let cleaned=rows.map(c=>({...c,uncertain:false,repeat:c.repeat!==false}));S.courses=S.keepExisting?[...S.courses,...cleaned.filter(c=>!S.courses.some(x=>x.name===c.name&&x.day===c.day&&x.start===c.start&&x.end===c.end))]:cleaned;S.importedConfirmed=true;S.previewEdit=false;S.ocrCourses=[];S.page=S.ocrOrigin==='setupSchedule'?'setupSchedule':'timetable';S.history=[];render();syncNative();toast('Timetable confirmed and saved')}
